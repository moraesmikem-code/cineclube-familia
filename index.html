<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#120D0B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cineclube da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120D0B;
    --panel:#1C1512;
    --panel2:#241B17;
    --line:#3A2E27;
    --gold:#D4A72C;
    --gold-dim:#8C7326;
    --cream:#F4EEE2;
    --muted:#A99C8D;
    --like:#4C9A6A;
    --dislike:#B84C3F;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:90px;}
  h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.03em;}
  a{color:inherit;}
  button{font-family:inherit;}
  .container{max-width:640px;margin:0 auto;padding:0 14px;}

  /* HEADER */
  header.top{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,var(--bg) 70%,rgba(18,13,11,0));
    padding:16px 0 10px;
  }
  .brand{display:flex;align-items:center;justify-content:space-between;}
  .brand h1{font-size:30px;margin:0;color:var(--gold);line-height:1;}
  .brand small{display:block;font-family:'Inter';font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
  .identity-pill{
    display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .identity-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold);color:#1A1310;}
  .btn-ghost{background:var(--panel);color:var(--cream);border:1px solid var(--line);}
  .btn-danger{background:transparent;color:var(--dislike);border:1px solid var(--dislike);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12px;border-radius:8px;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;}

  /* FAB */
  .fab{
    position:fixed;right:18px;bottom:22px;z-index:50;
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1A1310;
    display:flex;align-items:center;justify-content:center;font-size:30px;border:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
  }

  /* SETUP SCREEN */
  .center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;}
  .setup-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .setup-card h2{color:var(--gold);font-size:26px;margin:0 0 4px;}
  .setup-card p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.5;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:0.05em;}
  input[type=text],input[type=url],input[type=number],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--cream);
    border-radius:10px;padding:12px 12px;font-size:15px;font-family:'Inter';
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-dim);}
  .identity-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .identity-choices button{
    background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:10px;
    padding:14px;font-size:16px;font-weight:600;flex:1;min-width:90px;cursor:pointer;
  }

  /* FILTER BAR */
  .toolbar{display:flex;gap:14px;margin:10px 0 10px;flex-wrap:wrap;}
  .toolbar .btn{padding:12px 14px;}
  .toolbar .btn{flex:1 1 auto;min-width:0;}
  .search-box{position:relative;margin:10px 0;}
  .search-box input{padding-left:36px;}
  .search-box::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;}
  .panel h3{margin:0 0 10px;font-size:20px;color:var(--gold);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;
  }
  .chip.active{background:var(--gold);color:#1A1310;border-color:var(--gold);}
  .row-flex{display:flex;gap:10px;align-items:center;}
  .radio-row{display:flex;gap:8px;margin-top:4px;}
  .radio-row .chip{flex:1;text-align:center;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .field-inline{display:flex;gap:10px;}
  .field-inline > div{flex:1;}

  /* EMPTY STATE */
  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .empty .display{font-size:26px;color:var(--gold);margin-bottom:6px;}

  /* MOVIE CARD - TICKET STUB STYLE */
  .ticket{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin:14px 0;overflow:hidden;display:flex;
  }
  .ticket .poster{width:96px;min-width:96px;background:var(--panel2);object-fit:cover;}
  .ticket .poster-ph{width:96px;min-width:96px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px;background:var(--panel2);}
  .ticket-body{flex:1;padding:12px 14px;min-width:0;}
  .ticket-body h4{margin:0 0 2px;font-size:17px;font-weight:700;line-height:1.2;}
  .ticket-meta{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .genre-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .genre-tags span{background:var(--panel2);color:var(--muted);font-size:10.5px;padding:3px 8px;border-radius:6px;}
  .ratings-row{display:flex;gap:10px;font-size:12px;color:var(--cream);margin-bottom:6px;flex-wrap:wrap;}
  .ratings-row b{color:var(--gold);}
  .perf{
    position:relative;height:1px;background-image:repeating-linear-gradient(90deg,var(--line) 0 6px, transparent 6px 12px);
    margin:2px 0 8px;
  }
  .perf::before,.perf::after{
    content:"";position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--bg);
  }
  .perf::before{left:-19px;}
  .perf::after{right:-19px;}
  .checkin-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .checkin-badge{
    display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:8px;
    padding:4px 8px;font-size:11px;color:var(--muted);
  }
  .checkin-badge.done{color:var(--like);}
  .checkin-badge.mine{border:1px solid var(--gold-dim);}
  .votes-row{display:flex;gap:8px;flex-wrap:wrap;}
  .vote-badge{
    display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:8px;padding:5px 8px;font-size:11.5px;
  }
  .vote-badge .name{color:var(--muted);}
  .vote-badge .score{font-weight:700;color:var(--gold);}
  .vote-badge.mine{border:1px solid var(--gold-dim);}
  .vote-like{color:var(--like);}
  .vote-dislike{color:var(--dislike);}
  .vote-empty{color:var(--muted);font-style:italic;}

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;
  }
  .modal{
    background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    width:100%;max-height:92vh;overflow-y:auto;padding:18px 18px 30px;
  }
  .modal-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .modal h2{font-size:26px;color:var(--gold);margin:0;line-height:1.1;}
  .modal .close-x{font-size:26px;color:var(--muted);background:none;border:none;line-height:1;padding:0 4px;}
  .modal-poster{width:100%;max-width:220px;border-radius:10px;margin:12px auto;display:block;}
  .credits p{font-size:13.5px;color:var(--muted);margin:5px 0;line-height:1.5;}
  .credits b{color:var(--cream);}
  .synopsis{font-size:14px;line-height:1.6;color:var(--cream);margin:10px 0;}
  .vote-editor{background:var(--panel);border-radius:var(--radius);padding:14px;margin-top:10px;}
  .vote-editor h4{margin:0 0 10px;font-size:16px;color:var(--gold);}
  .like-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .like-toggle button{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);font-size:20px;cursor:pointer;
  }
  .like-toggle button.on-like{background:rgba(76,154,106,0.18);border-color:var(--like);color:var(--like);}
  .like-toggle button.on-neutral{background:rgba(212,167,44,0.18);border-color:var(--gold);color:var(--gold);}
  .like-toggle button.on-dislike{background:rgba(184,76,63,0.18);border-color:var(--dislike);color:var(--dislike);}
  .score-slider{width:100%;}
  .score-value{text-align:center;font-size:32px;color:var(--gold);font-family:'Bebas Neue';margin-top:4px;}
  .all-votes{margin-top:14px;}
  .all-votes .vote-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .loading-spin{
    border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;width:26px;height:26px;
    animation:spin 0.8s linear infinite;margin:20px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg-error{background:rgba(184,76,63,0.15);border:1px solid var(--dislike);color:#F3B3AA;padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0;}
  .msg-ok{background:rgba(76,154,106,0.15);border:1px solid var(--like);color:#BFE7CE;padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .release-alert{background:rgba(212,167,44,0.15);border:1px solid var(--gold-dim);color:var(--gold);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .streaming-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;}
  .streaming-row img{width:40px;height:40px;border-radius:9px;object-fit:cover;}
  .settings-link{text-align:center;margin:18px 0 6px;}
  .settings-link a{font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#0E0C0A;color:#A89F94">
    <div style="width:28px;height:28px;border:3px solid #2A241C;border-top-color:#D4A72C;border-radius:50%;animation:bootspin .8s linear infinite"></div>
    <div style="font-size:14px;margin-top:12px">Abrindo…</div>
  </div>
</div>
<style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCT8ESebwZWZVWfk7CT1Xk3NlG3b92wqcI",
  authDomain: "cineclube-familia.firebaseapp.com",
  projectId: "cineclube-familia",
  storageBucket: "cineclube-familia.firebasestorage.app",
  messagingSenderId: "999314831345",
  appId: "1:999314831345:web:4c95af68605544befd7650"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* Mapeia as chaves antigas (window.storage) para documentos/campos do Firestore */
const KEY_MAP = {
  'family-config': ['config','family'],
  'omdb-key':      ['config','omdbKey'],
  'tmdb-key':       ['config','tmdbKey'],
  'last-general-update': ['config','lastGeneralUpdateAt'],
  'update-error-log': ['config','updateErrorLog'],
  'import-error-log': ['config','importErrorLog'],
  'movies-v1':      ['movies','json'],
  'watchlists-v1':  ['watchlists','json'],
  'watching-v1':    ['watching','json'],
  'noted-v1':       ['noted','json'],
};

async function fbGet(key){
  const mapping = KEY_MAP[key];
  if(!mapping) return null;
  const [docId, field] = mapping;
  const snap = await getDoc(doc(db,'cineclube',docId));
  if(!snap.exists()) return null;
  const data = snap.data();
  return (field in data) ? data[field] : null;
}
async function fbSet(key, value){
  const mapping = KEY_MAP[key];
  if(!mapping) return { ok:false, error:'chave desconhecida: '+key };
  const [docId, field] = mapping;
  await setDoc(doc(db,'cineclube',docId), { [field]: value }, { merge:true });
  return { ok:true };
}

async function fbGetAllMovies(){
  const snap = await getDocs(collection(db,'movies-items'));
  return snap.docs.map(d=>d.data());
}
async function fbSaveMovie(movie){
  await setDoc(doc(db,'movies-items',movie.id), movie);
}
async function fbDeleteMovie(movieId){
  await deleteDoc(doc(db,'movies-items',movieId));
}
async function fbSaveMoviesBatch(movies){
  const chunkSize = 450; // limite do Firestore é 500 operações por lote
  for(let i=0;i<movies.length;i+=chunkSize){
    const chunk = movies.slice(i, i+chunkSize);
    const batch = writeBatch(db);
    chunk.forEach(m=> batch.set(doc(db,'movies-items',m.id), m));
    await batch.commit();
  }
}

(function(){

/* ---------- STORAGE HELPERS ---------- */
async function sGet(key, shared){
  if(key === 'my-identity'){
    try{ return localStorage.getItem('my-identity'); }catch(e){ return null; }
  }
  try{
    return await fbGet(key);
  }catch(e){ console.error('fb get failed', e); return null; }
}
async function sSet(key, value, shared){
  if(key === 'my-identity'){
    try{ localStorage.setItem('my-identity', value); return { ok:true }; }
    catch(e){ return { ok:false, error:'localStorage indisponível: '+e.message }; }
  }
  try{
    return await fbSet(key, value);
  }catch(e){
    console.error('storage set failed', e);
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}

/* ---------- STATE ---------- */
let state = {
  booted:false,
  family: null,        // {members:[names]}
  me: null,            // string name
  apiKey: null,
  movies: [],          // array of movie objects
  view: 'catalog',
  sortField: 'added',
  sortDir: 'desc',
  filters: { genres: [], status: 'all', statusWho: 'all', mediaType: 'all', decade:'all', continent:'all', language:'all', ratingOn:false, ratingSource:'', ratingValue:7 },
  search: '',
  modalMovie: null,
  addFlow: null,        // {step, url, data, error, loading}
  toast: null
};

const app = document.getElementById('app');

function uid(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function displayTitle(m){ return m.titlePt || m.titleOriginal || m.title || 'Sem título'; }
function altTitlesLine(m){
  const main = displayTitle(m);
  const parts = [];
  if(m.titleOriginal && m.titleOriginal !== main) parts.push('Original: ' + m.titleOriginal);
  if(m.titleEn && m.titleEn !== main && m.titleEn !== m.titleOriginal) parts.push('Inglês: ' + m.titleEn);
  return parts.join(' · ');
}
function displaySynopsis(m){ return m.synopsisPt || m.plot || ''; }
function renderReleaseAlert(m){
  const today = new Date().toISOString().slice(0,10);
  if(m.type==='series' && m.nextEpisode && m.nextEpisode.airDate){
    const future = m.nextEpisode.airDate >= today;
    return `<div class="release-alert">📅 ${future?'Próximo episódio':'Último episódio lançado'}: T${m.nextEpisode.season}E${m.nextEpisode.episode} — ${new Date(m.nextEpisode.airDate+'T00:00').toLocaleDateString('pt-BR')}</div>`;
  }
  if(m.type==='series' && m.seasons && m.seasons.length){
    const upcoming = m.seasons.filter(s=>s.airDate && s.airDate>=today).sort((a,b)=>a.airDate<b.airDate?-1:1)[0];
    if(upcoming){
      return `<div class="release-alert">📅 Próxima temporada (T${upcoming.number}): ${new Date(upcoming.airDate+'T00:00').toLocaleDateString('pt-BR')}</div>`;
    }
  }
  if(m.type!=='series' && m.theatricalBR){
    const d = new Date(m.theatricalBR.includes('T') ? m.theatricalBR : m.theatricalBR+'T00:00');
    if(!isNaN(d.getTime())){
      const iso = d.toISOString().slice(0,10);
      const future = iso >= today;
      return `<div class="release-alert">🎬 ${future?'Estreia nos cinemas do Brasil':'Estreou nos cinemas do Brasil'}: ${d.toLocaleDateString('pt-BR')}</div>`;
    }
  }
  return '';
}
function renderStreamingLogos(m){
  if(!m.streaming || !m.streaming.length) return m.lastUpdatedAt ? `<p class="hint" style="margin:6px 0 0">Não encontrado em nenhum streaming por assinatura no Brasil no momento.</p>` : '';
  return `<div class="streaming-row">
    ${m.streaming.map(s=>`<img src="https://image.tmdb.org/t/p/w92${s.logo}" title="${escapeHtml(s.name)}" alt="${escapeHtml(s.name)}">`).join('')}
  </div>`;
}
function getListData(listKey, person){
  return (state.lists && state.lists[listKey] && state.lists[listKey][person]) || { public: LIST_TYPES[listKey].hasPublic, items: [] };
}
function isInList(listKey, movieId){
  return getListData(listKey, state.me).items.some(it => it.movieId === movieId);
}
async function saveListData(listKey){
  await sSet(LIST_TYPES[listKey].storageKey, JSON.stringify(state.lists[listKey]), true);
}
async function toggleListItem(listKey, movieId){
  if(!state.lists[listKey][state.me]) state.lists[listKey][state.me] = { public: LIST_TYPES[listKey].hasPublic, items: [] };
  const arr = state.lists[listKey][state.me].items;
  const idx = arr.findIndex(it=>it.movieId===movieId);
  if(idx>=0) arr.splice(idx,1); else arr.push({ id: uid(), movieId, addedAt: new Date().toISOString() });
  await saveListData(listKey);
}
function normalizeLiked(v){
  if(v===true) return 'like';
  if(v===false) return 'dislike';
  if(v==='like'||v==='neutral'||v==='dislike') return v;
  return null;
}
function likedIcon(v){
  const n = normalizeLiked(v);
  return n==='like' ? '👍' : n==='neutral' ? '😐' : n==='dislike' ? '👎' : '';
}
function classifyByScore(score){
  if(score<=4) return 'dislike';
  if(score<=6) return 'neutral';
  return 'like';
}

/* ---------- INIT ---------- */
const LIST_TYPES = {
  priorities: { key:'priorities', storageKey:'watchlists-v1', label:'Prioridades', icon:'📋', hasPublic:true,
    desc:'Sua fila de "próximos a assistir".', addLabel:'⭐ Adicionar às Prioridades', addedLabel:'⭐ Já está nas suas Prioridades · toque para remover' },
  watching: { key:'watching', storageKey:'watching-v1', label:'Assistindo', icon:'👀', hasPublic:false,
    desc:'Filmes e séries que você está acompanhando agora.', addLabel:'👀 Adicionar aos Assistindo', addedLabel:'👀 Está nos seus Assistindo · toque para remover' },
  noted: { key:'noted', storageKey:'noted-v1', label:'Anotados', icon:'📝', hasPublic:false,
    desc:'Guarde aqui pra pesquisar ou se informar melhor depois.', addLabel:'📝 Adicionar aos Anotados', addedLabel:'📝 Está nos seus Anotados · toque para remover' },
};

const MOVIES_CACHE_KEY = 'cineclube-movies-cache-v1';

function loadMoviesCache(){
  try{
    const raw = localStorage.getItem(MOVIES_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.movies) && parsed.movies.length) return parsed.movies;
  }catch(e){ /* quota / parse */ }
  return null;
}
function saveMoviesCache(movies){
  // Sempre grava versão enxuta: abre bem mais rápido (~6000 títulos).
  // Sinopse/keywords/temporadas vêm do Firestore em background.
  try{
    const slim = movies.map(m=>({
      id:m.id, imdbId:m.imdbId, type:m.type, titlePt:m.titlePt, titleOriginal:m.titleOriginal,
      titleEn:m.titleEn, year:m.year, poster:m.poster, posterCustom:m.posterCustom,
      director:m.director, writer:m.writer,
      actors:m.actors, genres:m.genres, runtimeMin:m.runtimeMin, releaseDate:m.releaseDate,
      countries:m.countries, languages:m.languages, primaryLanguage:m.primaryLanguage,
      production:m.production, ratings:m.ratings, votes:m.votes, checkins:m.checkins,
      addedAt:m.addedAt, dismissedBy:m.dismissedBy, abandonedBy:m.abandonedBy,

const FAMILY_CACHE_KEY = 'cineclube-family-cache-v1';
function loadFamilyCache(){
  try{
    const raw = localStorage.getItem(FAMILY_CACHE_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(p && Array.isArray(p.members) && p.members.length) return p;
  }catch(e){}
  return null;
}
function saveFamilyCache(family){
  try{
    if(family && family.members && family.members.length)
      localStorage.setItem(FAMILY_CACHE_KEY, JSON.stringify(family));
  }catch(e){}
}
// Recupera nomes a partir dos votos/check-ins do catálogo (se a config sumiu)
function inferFamilyFromMovies(movies){
  const set = new Set();
  (movies||[]).forEach(m=>{
    Object.keys(m.votes||{}).forEach(n=>{ if(n) set.add(n); });
    Object.keys(m.checkins||{}).forEach(n=>{ if(n) set.add(n); });
    Object.keys(m.abandonedBy||{}).forEach(n=>{ if(n) set.add(n); });
  });
  const members = Array.from(set).filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return members.length ? { members } : null;
}
function applyConfigs(results){
  const [fam, key, tmdbKey, lastGeneralUpdate, updateErrorLogRaw, importErrorLogRaw, watchlists, watching, noted, me] = results;
  if(fam){
    try{
      const parsed = JSON.parse(fam);
      // Só aplica se veio lista válida; nunca trocar lista completa por lista vazia/mínima
      if(parsed && Array.isArray(parsed.members) && parsed.members.length){
        const curLen = (state.family && state.family.members) ? state.family.members.length : 0;
        // Prefere a lista do servidor se tiver pelo menos tantos membros quanto a local
        if(parsed.members.length >= curLen || curLen <= 1){
          state.family = parsed;
          saveFamilyCache(parsed);
        }
      }
    }catch(e){}
  }
  state.apiKey = key || null;
  state.tmdbKey = tmdbKey || null;
  state.lastGeneralUpdateAt = lastGeneralUpdate || null;
  try{ state.updateErrorLog = updateErrorLogRaw ? JSON.parse(updateErrorLogRaw) : []; }catch(e){ state.updateErrorLog = []; }
  try{ state.importErrorLog = importErrorLogRaw ? JSON.parse(importErrorLogRaw) : []; }catch(e){ state.importErrorLog = []; }
  state.watchlists = watchlists ? JSON.parse(watchlists) : {};
  state.lists = {
    priorities: state.watchlists,
    watching: watching ? JSON.parse(watching) : {},
    noted: noted ? JSON.parse(noted) : {}
  };
  if(me) state.me = me;
}

function refreshMoviesBackground(){
  // Nunca trava a UI: atualiza quando der e grava cache no idle
  fbGetAllMovies().then(movies=>{
    if(!movies || !movies.length) return;
    state.movies = movies;
    const save = ()=>{ try{ saveMoviesCache(movies); }catch(e){} };
    if(typeof requestIdleCallback === 'function') requestIdleCallback(save, { timeout: 3000 });
    else setTimeout(save, 400);
    if(!state.modalMovie && !state.addFlow && !state.settingsOpen && !state.importOpen){
      // Re-render suave: só se ainda na home
      render();
    }
  }).catch(e=>console.error('erro ao atualizar filmes em background', e));
}

async function init(){
  // Identidade local imediata
  try{ state.me = localStorage.getItem('my-identity') || null; }catch(e){ state.me = null; }
  state.catalogPageSize = 24;

  // Família: cache local → senão inferir dos filmes → senão placeholder temporário
  const famCached = loadFamilyCache();
  if(famCached) state.family = famCached;

  // Cache local de filmes → UI na hora (sem await de rede)
  let cached = null;
  try{ cached = loadMoviesCache(); }catch(e){ cached = null; }

  if(cached && cached.length){
    state.movies = cached;
    if(!state.family || !state.family.members || state.family.members.length <= 1){
      const inferred = inferFamilyFromMovies(cached);
      if(inferred) { state.family = inferred; saveFamilyCache(inferred); }
    }
    if(!state.family) state.family = { members: state.me ? [state.me] : ['Eu'] };
    state.booted = true;
    render();
    await new Promise(r => setTimeout(r, 0));

    Promise.all([
      sGet('family-config', true), sGet('omdb-key', true), sGet('tmdb-key', true),
      sGet('last-general-update', true), sGet('update-error-log', true), sGet('import-error-log', true),
      sGet('watchlists-v1', true), sGet('watching-v1', true), sGet('noted-v1', true),
      sGet('my-identity', false)
    ]).then(results=>{
      applyConfigs(results);
      // Se o servidor veio com poucos membros mas o catálogo tem mais nomes, mescla
      const inferred = inferFamilyFromMovies(state.movies);
      if(inferred && inferred.members.length > (state.family.members||[]).length){
        const merged = Array.from(new Set([...(state.family.members||[]), ...inferred.members]));
        state.family = { members: merged };
        saveFamilyCache(state.family);
        // Grava de volta no Firestore para restaurar
        sSet('family-config', JSON.stringify(state.family), true).catch(()=>{});
      }
      if(state.booted) render();
    }).catch(()=>{});

    setTimeout(refreshMoviesBackground, 600);
    return;
  }

  // Sem cache: spinner + carrega do Firestore (inevitável na 1ª vez)
  state.booted = false;
  render();

  try{
    const results = await Promise.all([
      sGet('family-config', true), sGet('omdb-key', true), sGet('tmdb-key', true),
      sGet('last-general-update', true), sGet('update-error-log', true), sGet('import-error-log', true),
      sGet('watchlists-v1', true), sGet('watching-v1', true), sGet('noted-v1', true),
      sGet('my-identity', false),
      fbGetAllMovies().catch(e=>{ console.error(e); return []; })
    ]);
    const movies = results.pop();
    applyConfigs(results);
    let list = movies || [];
    if(!list.length){
      try{
        const legacyJson = await sGet('movies-v1', true);
        if(legacyJson){
          const legacyMovies = JSON.parse(legacyJson);
          if(legacyMovies.length){
            list = legacyMovies;
            fbSaveMoviesBatch(list).catch(()=>{});
          }
        }
      }catch(e){}
    }
    state.movies = list;
    if(list.length){
      setTimeout(()=>{ try{ saveMoviesCache(list); }catch(e){} }, 200);
    }
  }catch(e){
    console.error('init falhou', e);
  }
  state.booted = true;
  render();
}

/* ---------- IMDB / OMDB / TMDB ---------- */
function extractImdbId(url){
  const m = url.match(/tt\d{6,9}/);
  return m ? m[0] : null;
}

async function fetchWithTimeout(url, ms=15000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    const res = await fetch(url, { signal: controller.signal });
    return res;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('Tempo esgotado ao buscar dados (conexão lenta ou instável).');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function fetchOmdb(imdbId){
  const url = `https://www.omdbapi.com/?apikey=${encodeURIComponent(state.apiKey)}&i=${imdbId}&plot=full`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  if(data.Response === 'False'){
    throw new Error(data.Error || 'Filme não encontrado.');
  }
  let rtCritics = null;
  let imdbFromRatings = null;
  let metaFromRatings = null;
  if(Array.isArray(data.Ratings)){
    data.Ratings.forEach(r=>{
      const src = (r.Source || '').toLowerCase();
      const val = String(r.Value || '');
      if(src.includes('rotten')){
        const pct = parseInt(val);
        if(!isNaN(pct)) rtCritics = Math.round((pct/10)*10)/10;
      } else if(src.includes('internet movie') || src === 'imdb'){
        const m = val.match(/([\d.]+)/);
        if(m) imdbFromRatings = parseFloat(m[1]);
      } else if(src.includes('metacritic')){
        const m = val.match(/([\d.]+)/);
        if(m){
          const n = parseFloat(m[1]);
          metaFromRatings = n > 10 ? Math.round((n/10)*10)/10 : n;
        }
      }
    });
  }
  let imdbRating = (data.imdbRating && data.imdbRating !== 'N/A') ? parseFloat(data.imdbRating) : null;
  if(imdbRating == null || isNaN(imdbRating)) imdbRating = imdbFromRatings;
  if(imdbRating != null && isNaN(imdbRating)) imdbRating = null;

  let imdbVotes = null;
  if(data.imdbVotes && data.imdbVotes !== 'N/A'){
    imdbVotes = parseInt(String(data.imdbVotes).replace(/,/g,''));
    if(isNaN(imdbVotes)) imdbVotes = null;
  }
  let metascore = (data.Metascore && data.Metascore !== 'N/A') ? Math.round((parseInt(data.Metascore)/10)*10)/10 : null;
  if(metascore == null || isNaN(metascore)) metascore = metaFromRatings;
  if(metascore != null && isNaN(metascore)) metascore = null;
  const runtimeMin = (data.Runtime && data.Runtime !== 'N/A') ? parseInt(data.Runtime) : null;
  let releaseDate = null;
  if(data.Released && data.Released !== 'N/A'){
    const d = new Date(data.Released);
    if(!isNaN(d)) releaseDate = d.toISOString();
  }
  const countries = (data.Country && data.Country !== 'N/A') ? data.Country.split(',').map(c=>c.trim()) : [];
  const languages = (data.Language && data.Language !== 'N/A') ? data.Language.split(',').map(l=>l.trim()) : [];
  const primaryLanguage = languages[0] || '';
  const production = (data.Production && data.Production !== 'N/A') ? data.Production : '';
  return {
    imdbId,
    type: (data.Type === 'series') ? 'series' : 'movie',
    titleEn: data.Title || '',
    year: data.Year || '',
    poster: (data.Poster && data.Poster !== 'N/A') ? data.Poster : '',
    plotEn: (data.Plot && data.Plot !== 'N/A') ? data.Plot : '',
    director: (data.Director && data.Director !== 'N/A') ? data.Director : '',
    writer: (data.Writer && data.Writer !== 'N/A') ? data.Writer : '',
    actors: (data.Actors && data.Actors !== 'N/A') ? data.Actors : '',
    genres: (data.Genre && data.Genre !== 'N/A') ? data.Genre.split(',').map(g=>translateGenre(g.trim())) : [],
    countries, languages, primaryLanguage, production,
    runtimeMin,
    releaseDate,
    ratings: { imdb: imdbRating, imdbVotes: imdbVotes, rtCritics: rtCritics, metacritic: metascore }
  };
}

async function fetchTmdbLang(imdbId, lang, mediaType){
  const url = `https://api.themoviedb.org/3/find/${imdbId}?api_key=${encodeURIComponent(state.tmdbKey)}&external_source=imdb_id&language=${lang}`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  if(mediaType === 'series'){
    if(data.tv_results && data.tv_results.length){
      const r = data.tv_results[0];
      return { title: r.name, original_title: r.original_name, overview: r.overview };
    }
    return null;
  }
  if(data.movie_results && data.movie_results.length){
    const r = data.movie_results[0];
    return { title: r.title, original_title: r.original_title, overview: r.overview };
  }
  return null;
}

async function fetchTmdbId(imdbId, mediaType){
  const url = `https://api.themoviedb.org/3/find/${imdbId}?api_key=${encodeURIComponent(state.tmdbKey)}&external_source=imdb_id`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  const result = mediaType==='series' ? (data.tv_results||[])[0] : (data.movie_results||[])[0];
  return result ? result.id : null;
}

async function fetchTmdbIdByTitle(title, year, mediaType){
  if(!title) return null;
  const searchType = mediaType==='series' ? 'tv' : 'movie';
  const yearParam = mediaType==='series' ? 'first_air_date_year' : 'year';
  const url = `https://api.themoviedb.org/3/search/${searchType}?api_key=${encodeURIComponent(state.tmdbKey)}&query=${encodeURIComponent(title)}${year?`&${yearParam}=${encodeURIComponent(year)}`:''}`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  const results = data.results || [];
  if(!results.length) return null;
  return results[0].id;
}

async function fetchTmdbKeywords(tmdbId, mediaType){
  try{
    const path = mediaType === 'series' ? 'tv' : 'movie';
    const url = `https://api.themoviedb.org/3/${path}/${tmdbId}/keywords?api_key=${encodeURIComponent(state.tmdbKey)}`;
    const res = await fetchWithTimeout(url);
    const data = await res.json();
    // TMDB: movies usam "keywords", séries usam "results"
    const list = data.keywords || data.results || [];
    return list.map(k => (k.name || '').toLowerCase().trim()).filter(Boolean);
  }catch(e){
    return [];
  }
}

async function fetchTmdbDetails(imdbId, mediaType, fallbackTitle, fallbackYear){
  let tmdbId = await fetchTmdbId(imdbId, mediaType);
  if(!tmdbId && fallbackTitle){
    tmdbId = await fetchTmdbIdByTitle(fallbackTitle, fallbackYear, mediaType);
  }
  if(!tmdbId) return null;
  if(mediaType === 'series'){
    const url = `https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${encodeURIComponent(state.tmdbKey)}&language=pt-BR&append_to_response=watch/providers`;
    const res = await fetchWithTimeout(url);
    const data = await res.json();
    const providers = (data['watch/providers'] && data['watch/providers'].results && data['watch/providers'].results.BR) || {};
    const streaming = (providers.flatrate||[]).map(p=>({name:p.provider_name, logo:p.logo_path}));
    const keywords = await fetchTmdbKeywords(tmdbId, 'series');
    return {
      tmdbId,
      status: data.status || null,
      nextEpisode: data.next_episode_to_air ? { season:data.next_episode_to_air.season_number, episode:data.next_episode_to_air.episode_number, airDate:data.next_episode_to_air.air_date } : null,
      seasons: (data.seasons||[]).filter(s=>s.season_number>0).map(s=>({ number:s.season_number, episodeCount:s.episode_count, airDate:s.air_date, name:s.name })),
      streaming,
      keywords
    };
  }
  const url = `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${encodeURIComponent(state.tmdbKey)}&language=pt-BR&append_to_response=release_dates,watch/providers`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  const providers = (data['watch/providers'] && data['watch/providers'].results && data['watch/providers'].results.BR) || {};
  const streaming = (providers.flatrate||[]).map(p=>({name:p.provider_name, logo:p.logo_path}));
  let theatricalBR = null;
  const brBlock = (data.release_dates && data.release_dates.results || []).find(r=>r.iso_3166_1==='BR');
  if(brBlock && brBlock.release_dates && brBlock.release_dates.length){
    const theatrical = brBlock.release_dates.find(rd=>rd.type===3) || brBlock.release_dates[0];
    if(theatrical && theatrical.release_date) theatricalBR = theatrical.release_date;
  }
  const keywords = await fetchTmdbKeywords(tmdbId, 'movie');
  return { tmdbId, status: data.status || null, theatricalBR, streaming, keywords };
}

async function fetchTmdbSeasonEpisodes(tmdbId, seasonNumber){
  const url = `https://api.themoviedb.org/3/tv/${tmdbId}/season/${seasonNumber}?api_key=${encodeURIComponent(state.tmdbKey)}&language=pt-BR`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  return (data.episodes||[]).map(e=>({ number:e.episode_number, name:e.name, airDate:e.air_date, overview:e.overview }));
}

async function translateToPt(text){
  if(!text) return { text:'', ok:false };
  try{
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetchWithTimeout(url);
    const data = await res.json();
    const translated = data[0].map(chunk => chunk[0]).join('');
    return { text: translated, ok:true };
  }catch(e){
    return { text:'', ok:false };
  }
}

async function fetchAllSources(imdbId){
  const omdb = await fetchOmdb(imdbId);
  let titleOriginal = omdb.titleEn, titlePt = '', synopsisPt = '', synopsisAuto = false;
  if(state.tmdbKey){
    try{
      const [pt, en] = await Promise.all([
        fetchTmdbLang(imdbId, 'pt-BR', omdb.type),
        fetchTmdbLang(imdbId, 'en-US', omdb.type)
      ]);
      if(pt || en){
        titleOriginal = (pt && pt.original_title) || (en && en.original_title) || omdb.titleEn;
        titlePt = (pt && pt.title) || '';
        synopsisPt = (pt && pt.overview) || '';
        if(en && en.title && !omdb.titleEn) omdb.titleEn = en.title;
      }
    }catch(e){ /* segue sem TMDB se falhar */ }
  }
  if(!synopsisPt){
    const source = omdb.plotEn;
    if(source){
      const t = await translateToPt(source);
      if(t.ok){ synopsisPt = t.text; synopsisAuto = true; }
    }
  }
  return {
    imdbId,
    type: omdb.type,
    titleOriginal: titleOriginal || omdb.titleEn || 'Sem título',
    titleEn: omdb.titleEn || '',
    titlePt: titlePt || '',
    year: omdb.year,
    poster: omdb.poster,
    synopsisPt: synopsisPt || '',
    synopsisAuto,
    director: omdb.director, writer: omdb.writer, actors: omdb.actors,
    genres: omdb.genres, runtimeMin: omdb.runtimeMin, releaseDate: omdb.releaseDate,
    countries: omdb.countries, languages: omdb.languages, primaryLanguage: omdb.primaryLanguage, production: omdb.production,
    ratings: omdb.ratings
  };
}

function titleMatchesSearch(m, q){
  const parts = [m.titlePt, m.titleOriginal, m.titleEn, m.title, displayTitle(m)]
    .filter(Boolean).map(s=>String(s).toLowerCase());
  return parts.some(t => t.includes(q));
}

function getFilteredSorted(){
  let list = state.movies.slice();
  list = list.filter(m => !(m.hiddenBy && m.hiddenBy.includes(state.me)));
  const f = state.filters;

  // Busca: sempre no catálogo inteiro (ignora tipo, gênero, status etc.)
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(m => titleMatchesSearch(m, q));
    return sortMovieList(list, state.sortField, state.sortDir);
  }

  if(f.mediaType !== 'all'){
    list = list.filter(m => (m.type || 'movie') === f.mediaType);
  }
  if(f.decade !== 'all'){
    list = list.filter(m => { const y=parseInt(m.year); return !isNaN(y) && Math.floor(y/10)*10 === Number(f.decade); });
  }
  if(f.continent !== 'all'){
    list = list.filter(m => (m.countries||[]).some(c => countryToContinent(c) === f.continent));
  }
  if(f.language !== 'all'){
    list = list.filter(m => (m.primaryLanguage || (m.languages||[])[0]) === f.language);
  }
  if(f.genres.length){
    list = list.filter(m => (m.genres||[]).some(g => f.genres.includes(g)));
  }
  if(f.status !== 'all'){
    const who = f.statusWho || 'all';
    const wantWatched = f.status === 'watched';
    list = list.filter(m=>{
      const checked = (name) => !!(m.checkins && m.checkins[name]);
      if(who === 'all'){
        return wantWatched
          ? state.family.members.every(checked)
          : state.family.members.every(name=>!checked(name));
      }
      return wantWatched ? checked(who) : !checked(who);
    });
  }
  if(f.ratingOn && f.ratingSource){
    list = list.filter(m=>{
      let val = null;
      if(f.ratingSource === 'avg') {
        val = familyAvg(m);
      } else if (f.ratingSource === 'avgExternal') {
        // Lógica para somar apenas as notas que existem (ignora os nulls)
        let sum = 0; let count = 0;
        if (m.ratings && m.ratings.imdb != null) { sum += m.ratings.imdb; count++; }
        if (m.ratings && m.ratings.rtCritics != null) { sum += m.ratings.rtCritics; count++; }
        if (m.ratings && m.ratings.metacritic != null) { sum += m.ratings.metacritic; count++; }
        if (count > 0) val = sum / count;
      } else if(f.ratingSource.startsWith('member:')){
        const name = f.ratingSource.split(':')[1];
        val = m.votes[name] ? m.votes[name].score : null;
      } else {
        val = m.ratings ? m.ratings[f.ratingSource] : null;
      }
      if(val==null) return false;
      return Math.floor(val) === Number(f.ratingValue);
    });
  }
  return sortMovieList(list, state.sortField, state.sortDir);
}

        if (m.ratings && m.ratings.rtCritics != null) { sum += m.ratings.rtCritics; count++; }

        if (count > 0) val = sum / count;

// Cache de % de recomendação: sobrevive entre ordenações até o usuário avaliar mais filmes
let _recPctCache = { key: '', map: new Map() };

function ratedCountFor(person){
  let n = 0;
  for(let i=0;i<state.movies.length;i++){
    const v = state.movies[i].votes && state.movies[i].votes[person];
    if(v && v.score != null) n++;
  }
  return n;
}
function ensureRecCacheBucket(person){
  // "v11" no key força recalcular depois da mudança de fórmula
  const key = 'v11:' + person + ':' + ratedCountFor(person);
  if(_recPctCache.key !== key){
    _recPctCache = { key, map: new Map() };
  }
  return _recPctCache.map;
}
function getAffinityPct(movie, person){
  const map = ensureRecCacheBucket(person);
  if(map.has(movie.id)) return map.get(movie.id);
  let pct = -1;
  try{
    const rec = estimateAffinity(movie, person);
    if(rec && rec.ready && rec.pct != null) pct = rec.pct;
  }catch(e){ pct = -1; }
  map.set(movie.id, pct);
  return pct;
}
// Preenche o cache em fatias para não travar a UI
async function warmRecCache(list, person, onProgress){
  const map = ensureRecCacheBucket(person);
  const missing = [];
  for(let i=0;i<list.length;i++){
    if(!map.has(list[i].id)) missing.push(list[i]);
  }
  if(missing.length === 0){
    if(onProgress) onProgress(0, 0);
    return;
  }
  const CHUNK = 120;
  for(let i=0;i<missing.length;i+=CHUNK){
    const end = Math.min(i+CHUNK, missing.length);
    for(let j=i;j<end;j++) getAffinityPct(missing[j], person);
    if(onProgress) onProgress(end, missing.length);
    // Cede o thread para a UI respirar
    await new Promise(r => setTimeout(r, 0));
  }
}

function sortMovieList(list, field, dir){
  const dirMul = dir === 'asc' ? 1 : -1;

  // Usa cache de recomendações (já aquecido ou sob demanda)
  let recMap = null;
  if(field === 'recommendation'){
    recMap = ensureRecCacheBucket(state.me);
    for(const m of list){
      if(!recMap.has(m.id)) getAffinityPct(m, state.me);
    }
  }

  function keyOf(m){
    switch(field){
      case 'added': return m.addedAt;
      case 'release': return m.releaseDate || '';
      case 'alpha': return displayTitle(m).toLowerCase();
      case 'runtime': return m.runtimeMin || 0;
      case 'imdb': return (m.ratings && m.ratings.imdb != null) ? m.ratings.imdb : -1;
      case 'imdbVotes': return (m.ratings && m.ratings.imdbVotes != null) ? m.ratings.imdbVotes : -1;
      case 'rtCritics': return (m.ratings && m.ratings.rtCritics != null) ? m.ratings.rtCritics : -1;
      case 'metacritic': return (m.ratings && m.ratings.metacritic != null) ? m.ratings.metacritic : -1;
      case 'familyAvg': {
        const avg = familyAvg(m);
        return avg != null ? avg : -1;
      }
      case 'recommendation':
        return recMap ? (recMap.get(m.id) ?? -1) : -1;
      default:
        if(field.startsWith('member:')){
          const name = field.split(':')[1];
          return (m.votes[name] && m.votes[name].score!=null) ? m.votes[name].score : -1;
        }
        return 0;
    }
  }
  const out = list.slice();
  out.sort((a,b)=>{
    const ka=keyOf(a), kb=keyOf(b);
    if(ka<kb) return -1*dirMul;
    if(ka>kb) return 1*dirMul;
    if(field==='recommendation'){
      const ia = (a.ratings && a.ratings.imdb != null) ? a.ratings.imdb : -1;
      const ib = (b.ratings && b.ratings.imdb != null) ? b.ratings.imdb : -1;
      if(ia!==ib) return (ia<ib) ? 1 : -1; // desempate: maior nota do IMDb primeiro, sempre
    }
    return 0;
  });
  return out;
}

function catalogListHtml(list){
  if(list.length===0){
    return `
      <div class="empty">
        <div class="display">Nenhum filme por aqui ainda</div>
        <p>Toque no botão dourado para colar o link de um filme do IMDb e começar o catálogo da família.</p>
      </div>`;
  }
  if(!state.catalogPageSize) state.catalogPageSize = 30;
  const pageSize = state.catalogPageSize;
  const visible = list.slice(0, pageSize);
  let html = visible.map(renderCard).join('');
  if(list.length > pageSize){
    html += `<button class="btn btn-ghost btn-block" style="margin:10px 0" onclick="__loadMoreCatalog()">Carregar mais (${list.length - pageSize} restantes)</button>`;
  }
  return html;
}
window.__loadMoreCatalog = ()=>{
  state.catalogPageSize = (state.catalogPageSize||30) + 30;
  const el = document.getElementById('catalog');
  if(el) el.innerHTML = catalogListHtml(getFilteredSorted());
};

  window.__openSettings = ()=>{ state.settingsOpen = true; render(); };
  window.__openList = (listKey)=>{ state.listOpen = listKey; render(); };
  window.__openMovie = (id)=>{ state.modalMovie = id; render(); };
}

function ratingChip(label, val, scale){
  if(val==null || val==='' || (typeof val==='number' && isNaN(val))) return `<span>${label}: <span style="color:var(--muted)">—</span></span>`;
  const n = typeof val === 'number' ? val : parseFloat(val);
  if(isNaN(n)) return `<span>${label}: <span style="color:var(--muted)">—</span></span>`;
  return `<span>${label}: <b>${n.toFixed(1)}</b></span>`;
}
function posterUrl(m){
  return (m && (m.posterCustom || m.poster)) || '';
}

/** Atualiza modal aberto e card do catálogo sem redesenhar tudo */
function patchVoteUI(movie, person){
  if(!movie) return;
  const v = movie.votes && movie.votes[person];
  // --- Modal: votos da família ---
  const allVotes = document.querySelector('#movie-overlay .all-votes');
  if(allVotes && state.family && state.family.members){
    const lines = state.family.members.map(name=>{
      const vv = movie.votes[name];
      const has = vv && (vv.score!=null || vv.liked!=null);
      const icon = !has ? '<span class="vote-empty">sem voto ainda</span>' :
        `${likedIcon(vv.liked)} ${vv.score!=null?'<b style="color:var(--gold)">'+vv.score+'/10</b>':''}`;
      return `<div class="vote-line"><span>${name}</span><span>${icon}</span></div>`;
    }).join('');
    const avg = familyAvg(movie);
    allVotes.innerHTML = `
      <h4 style="color:var(--gold);font-size:16px;margin-bottom:6px">Votos da família</h4>
      ${lines}
      <div class="vote-line"><span>Média da família</span><span><b style="color:var(--gold)">${avg ?? '—'}</b></span></div>`;
  }
  // --- Modal: check-in badges (se existirem) ---
  const checkinRow = document.querySelector('#movie-overlay .checkin-row');
  if(checkinRow && state.family){
    checkinRow.innerHTML = state.family.members.map(name=>{
      const done = movie.checkins && movie.checkins[name];
      const mine = name === state.me;
      return `<div class="checkin-badge ${done?'done':''} ${mine?'mine':''}">${done?'✔':'○'} ${name}</div>`;
    }).join('');
  }
  // --- Card no catálogo (se visível) ---
  const catalog = document.getElementById('catalog');
  if(catalog){
    const tickets = catalog.querySelectorAll('.ticket');
    tickets.forEach(ticket=>{
      const onclick = ticket.getAttribute('onclick') || '';
      if(!onclick.includes(movie.id)) return;
      // Substitui só a faixa de votos e check-in
      const votesRow = ticket.querySelector('.votes-row');
      if(votesRow && state.family){
        votesRow.innerHTML = state.family.members.map(name=>{
          const vv = movie.votes[name];
          const mine = name === state.me;
          if(!vv || (vv.score==null && vv.liked==null)){
            return `<div class="vote-badge ${mine?'mine':''}"><span class="name">${name}</span><span class="vote-empty">sem voto</span></div>`;
          }
          const likeIcon = `<span>${likedIcon(vv.liked)}</span>`;
          const scoreTxt = vv.score!=null ? `<span class="score">${vv.score}</span>` : '';
          return `<div class="vote-badge ${mine?'mine':''}"><span class="name">${name}</span>${likeIcon}${scoreTxt}</div>`;
        }).join('');
      }
      const cRow = ticket.querySelector('.checkin-row');
      if(cRow && state.family){
        cRow.innerHTML = state.family.members.map(name=>{
          const done = movie.checkins && movie.checkins[name];
          const mine = name === state.me;
          return `<div class="checkin-badge ${done?'done':''} ${mine?'mine':''}">${done?'✔':'○'} ${name}</div>`;
        }).join('');
      }
      // Atualiza % de recomendação no card se estiver visível
      const ratingsRow = ticket.querySelector('.ratings-row');
      if(ratingsRow){
        const spans = ratingsRow.querySelectorAll('span');
        spans.forEach(sp=>{
          if(/Recomendação/i.test(sp.textContent||'')){
            const pct = getAffinityPct(movie, state.me);
            sp.innerHTML = pct>=0 ? `Recomendação: <b style="color:var(--gold)">${pct}%</b>` : '';
          }
        });
      }
    });
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function renderAddModal(){
  const af = state.addFlow;
  let inner = '';
  if(!state.apiKey){
    inner = `

        Antes de adicionar filmes, o Cineclube precisa de uma chave gratuita da OMDb API

        para cadastrar sua chave — leva 1 minuto.
      </p>

    `;
  } else if(af.step === 'input'){
    inner = `
      <label style="margin-top:0">Cole o link do filme no IMDb</label>
      <input type="url" id="imdb-url" placeholder="https://www.imdb.com/title/tt1234567/" value="${escapeAttr(af.url)}">

      ${af.error ? `<div class="msg-error">${escapeHtml(af.error)}</div>` : ''}

        ${af.loading ? 'Buscando...' : 'Buscar filme'}
      </button>
      ${af.loading ? '<div class="loading-spin"></div>' : ''}
    `;
  } else if(af.step === 'duplicate'){
    const existing = af.existingMovie;
    inner = `
      <img class="modal-poster" src="${existing.poster || ''}" onerror="this.style.display='none'">
      <h3 style="margin:0 0 10px">${escapeHtml(displayTitle(existing))}</h3>
      <div class="msg-error">Esse título já está no catálogo — foi adicionado antes.</div>
      <p style="font-size:13.5px;color:var(--muted);margin-top:10px">Se você já assistiu, é só abrir o filme e registrar seu voto e check-in — não precisa adicionar de novo.</p>
      <button class="btn btn-gold btn-block" style="margin-top:16px" onclick="__closeAdd(); __openMovie('${existing.id}')">Abrir e avaliar</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="__closeAdd()">Fechar</button>
    `;
  } else if(af.step === 'confirm'){
    const d = af.data;
    const displayTitle = d.titlePt || d.titleOriginal;
    const altTitles = [];
    if(d.titleOriginal && d.titleOriginal !== displayTitle) altTitles.push('Original: ' + d.titleOriginal);
    if(d.titleEn && d.titleEn !== displayTitle && d.titleEn !== d.titleOriginal) altTitles.push('Inglês: ' + d.titleEn);
    inner = `
      <img class="modal-poster" src="${d.poster || ''}" onerror="this.style.display='none'">
      <h3 style="margin:0 0 4px">${escapeHtml(displayTitle)} ${d.year?`(${d.year})`:''}</h3>
      ${altTitles.length ? `<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">${altTitles.map(escapeHtml).join(' · ')}</p>` : ''}
      <p class="synopsis">${escapeHtml(d.synopsisPt) || '<span style="color:var(--muted)">Sinopse não encontrada.</span>'}</p>
      ${d.synopsisAuto ? `<div class="hint">🌐 Sinopse traduzida automaticamente (não havia sinopse oficial em PT-BR).</div>` : ''}
      <div class="credits">
        <p><b>Diretor:</b> ${escapeHtml(d.director)||'—'}</p>
        <p><b>Roteirista:</b> ${escapeHtml(d.writer)||'—'}</p>
        <p><b>Elenco:</b> ${escapeHtml(d.actors)||'—'}</p>
        <p><b>Gêneros:</b> ${(d.genres||[]).join(', ')||'—'}</p>
        <p><b>País:</b> ${(d.countries||[]).join(', ')||'—'}</p>
        <p><b>Idioma:</b> ${(d.languages||[]).join(', ')||'—'}</p>
        <p><b>Duração:</b> ${d.runtimeMin?d.runtimeMin+' min':'—'}</p>
      </div>
      <div class="divider"></div>
      <div class="field-inline">
        <div>
          <label style="margin-top:0">IMDb (0–10)</label>
          <input type="text" value="${d.ratings.imdb ?? ''}" disabled>
        </div>
        <div>
          <label style="margin-top:0">Metacritic (0–10)</label>
          <input type="text" value="${d.ratings.metacritic ?? ''}" disabled>
        </div>
      </div>
      <label>Rotten Tomatoes (0–10)</label>
      <input type="number" step="0.1" min="0" max="10" id="rt-critics-input" value="${d.ratings.rtCritics ?? ''}" placeholder="preenchido automaticamente quando disponível">
      <div class="hint">IMDb e Metacritic vêm automáticos. O Rotten Tomatoes também, quando disponível — pode ajustar aqui se quiser.</div>
      <button class="btn btn-gold btn-block" style="margin-top:16px" onclick="__confirmAdd()">Adicionar ao catálogo</button>
    `;
  }
  document.body.insertAdjacentHTML('beforeend', `
  <div class="overlay" id="add-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>Adicionar filme</h2><button class="close-x" onclick="__closeAdd()">×</button></div>
      ${inner}
    </div>
  </div>`);
  document.getElementById('add-overlay').addEventListener('click', (e)=>{ if(e.target.id==='add-overlay') __closeAdd(); });

  window.__closeAdd = ()=>{ state.addFlow=null; render(); };
  window.__searchImdb = async ()=>{
    const val = document.getElementById('imdb-url').value.trim();
    const id = extractImdbId(val);
    if(!id){ state.addFlow.error='Não encontrei um ID válido do IMDb nesse link (deve conter algo como tt1234567).'; render(); return; }
    const existing = state.movies.find(m=>m.imdbId===id);
    if(existing){ state.addFlow.step='duplicate'; state.addFlow.existingMovie=existing; render(); return; }
    state.addFlow.loading = true; state.addFlow.error=null; state.addFlow.url=val; render();
    try{
      const data = await fetchAllSources(id);
      state.addFlow.loading=false; state.addFlow.step='confirm'; state.addFlow.data=data; render();
    }catch(e){
      state.addFlow.loading=false; state.addFlow.error = e.message || 'Erro ao buscar filme.'; render();
    }
  };
  window.__confirmAdd = async ()=>{
    const d = state.addFlow.data;
    const rtcVal = document.getElementById('rt-critics-input').value;
    d.ratings.rtCritics = rtcVal!=='' ? parseFloat(rtcVal) : d.ratings.rtCritics;
    const movie = {
      id: uid(),
      imdbId: d.imdbId,
      titleOriginal: d.titleOriginal, titleEn: d.titleEn, titlePt: d.titlePt,
      type: d.type || 'movie',
      year: d.year, poster: d.poster,
      synopsisPt: d.synopsisPt, synopsisAuto: d.synopsisAuto,
      director: d.director, writer: d.writer, actors: d.actors, genres: d.genres,
      countries: d.countries||[], languages: d.languages||[], primaryLanguage: d.primaryLanguage||'', production: d.production||'',
      runtimeMin: d.runtimeMin, releaseDate: d.releaseDate, ratings: d.ratings,
      addedAt: new Date().toISOString(), addedBy: state.me, votes: {}, hiddenBy: [], dismissedBy: []
    };
    state.family.members.forEach(m => movie.votes[m] = {liked:null, score:null});
    movie.checkins = {};
    state.family.members.forEach(m => movie.checkins[m] = null);
    state.movies.push(movie);
    await fbSaveMovie(movie);
    state.addFlow = null;
    render();
  };
}

function mergeFreshOmdbInto(movie, fresh){
  if(!movie.ratings) movie.ratings = {};
  if(!fresh.ratings) fresh.ratings = {};
  // Atualiza sempre que a OMDb trouxer valor (não só quando o campo antigo era null)
  if(fresh.ratings.imdb != null) movie.ratings.imdb = fresh.ratings.imdb;
  if(fresh.ratings.imdbVotes != null) movie.ratings.imdbVotes = fresh.ratings.imdbVotes;
  if(fresh.ratings.rtCritics != null) movie.ratings.rtCritics = fresh.ratings.rtCritics;
  if(fresh.ratings.metacritic != null) movie.ratings.metacritic = fresh.ratings.metacritic;
  if(fresh.countries && fresh.countries.length) movie.countries = fresh.countries;
  if(fresh.languages && fresh.languages.length){ movie.languages = fresh.languages; movie.primaryLanguage = fresh.languages[0]; }
  if(fresh.production) movie.production = fresh.production;
  if(fresh.director) movie.director = fresh.director;
  if(fresh.actors) movie.actors = fresh.actors;
  if(fresh.writer) movie.writer = fresh.writer;
  if(fresh.runtimeMin) movie.runtimeMin = fresh.runtimeMin;
}

        <button class="btn ${isInList('noted',m.id)?'btn-ghost':'btn-gold'} btn-sm" style="flex:1" onclick="__toggleListFromMovie('noted','${m.id}')">${isInList('noted',m.id)?'📝 Anotado':'📝 Anotar'}</button>
      </div>
      <div class="field-inline" style="margin-top:8px">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="__shareImdbLink('${m.imdbId}')">🔗 Compartilhar</button>
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="__dismissFromMovie('${m.id}')">🚫 Não me interessa mais</button>
      </div>

      <div class="vote-editor">
        <h4>Check-in</h4>
        ${(()=>{ const mine = m.checkins && m.checkins[state.me]; return `
        <button class="btn ${mine?'btn-ghost':'btn-gold'} btn-block" onclick="__toggleCheckin('${m.id}')">
          ${mine ? '✔ Você assistiu em '+new Date(mine).toLocaleDateString('pt-BR')+' · toque para desfazer' : '✔ Marcar que eu assisti'}
        </button>`; })()}
        <div class="all-votes" style="margin-top:10px">
          ${state.family.members.map(name=>{
            const c = m.checkins && m.checkins[name];
            return `<div class="vote-line"><span>${name}</span><span>${c ? '✔ '+new Date(c).toLocaleDateString('pt-BR') : '<span class="vote-empty">ainda não assistiu</span>'}</span></div>`;
          }).join('')}
        </div>
      </div>

      <div class="vote-editor">
        <h4>Abandono</h4>
        <div class="hint" style="margin-top:0">Se você começou e desistiu no meio, isso vira um sinal negativo no algoritmo (mais forte se parou cedo).</div>
        ${(()=>{
          const ab = m.abandonedBy && m.abandonedBy[state.me];
          if(ab){
            return `<div class="hint" style="margin:8px 0">Você marcou abandono em ${new Date(ab.at).toLocaleDateString('pt-BR')}${ab.pctWatched!=null?' · ~'+ab.pctWatched+'% assistido':''}.</div>
            <button class="btn btn-ghost btn-block" onclick="__clearAbandon('${m.id}')">Desfazer abandono</button>`;
          }
          const seriesPct = (m.type==='series') ? seriesProgressPct(m, state.me) : null;
          return `
          <label>Quanto % você chegou a assistir? (opcional)</label>
          <input type="number" min="1" max="99" id="abandon-pct" value="${seriesPct != null ? seriesPct : 25}" placeholder="ex: 20">
          <button class="btn btn-ghost btn-block" style="margin-top:8px;border-color:var(--dislike);color:var(--dislike)" onclick="__markAbandon('${m.id}')">⏹ Marcar que desisti / abandonei</button>`;
        })()}
      </div>

      <div class="vote-editor">
        <h4>Seu voto (${state.me})</h4>
        <div class="like-toggle">
          <button id="btn-like" class="${(normalizeLiked(myVote.liked) || classifyByScore(myVote.score ?? 5))==='like'?'on-like':''}" onclick="__setLiked('like')">👍 Gostei</button>
          <button id="btn-neutral" class="${(normalizeLiked(myVote.liked) || classifyByScore(myVote.score ?? 5))==='neutral'?'on-neutral':''}" onclick="__setLiked('neutral')">😐 Mediano</button>
          <button id="btn-dislike" class="${(normalizeLiked(myVote.liked) || classifyByScore(myVote.score ?? 5))==='dislike'?'on-dislike':''}" onclick="__setLiked('dislike')">👎 Não gostei</button>
        </div>
        <label style="margin-top:0">Sua nota</label>
        <input type="range" min="1" max="10" step="1" class="score-slider" id="score-slider" value="${myVote.score ?? 5}" oninput="__previewScore(this.value)">
        <div class="score-value" id="score-display">${myVote.score ?? 5}</div>
        <button class="btn btn-gold btn-block" style="margin-top:12px" onclick="__saveVote()">Salvar voto</button>
      </div>

      <div class="all-votes">
        <h4 style="color:var(--gold);font-size:16px;margin-bottom:6px">Votos da família</h4>
        ${state.family.members.map(name=>{
          const v = m.votes[name];
          const has = v && (v.score!=null || v.liked!=null);
          const icon = !has ? '<span class="vote-empty">sem voto ainda</span>' :
            `${likedIcon(v.liked)} ${v.score!=null?'<b style="color:var(--gold)">'+v.score+'/10</b>':''}`;
          return `<div class="vote-line"><span>${name}</span><span>${icon}</span></div>`;
        }).join('')}
        <div class="vote-line"><span>Média da família</span><span><b style="color:var(--gold)">${familyAvg(m) ?? '—'}</b></span></div>
      </div>

      <button class="btn btn-danger btn-block" style="margin-top:20px" onclick="__deleteMovie('${m.id}')">Remover filme só da minha lista</button>
    </div>
  </div>`);
  document.getElementById('movie-overlay').addEventListener('click',(e)=>{ if(e.target.id==='movie-overlay') __closeMovie(); });

  let manualOverride = false;
  let pendingLiked = normalizeLiked(myVote.liked) || classifyByScore(myVote.score ?? 5);
  window.__setLiked = (val)=>{
    manualOverride = true;
    pendingLiked = (pendingLiked===val) ? null : val;
    document.getElementById('btn-like').className = pendingLiked==='like'?'on-like':'';
    document.getElementById('btn-neutral').className = pendingLiked==='neutral'?'on-neutral':'';
    document.getElementById('btn-dislike').className = pendingLiked==='dislike'?'on-dislike':'';
  };
  window.__previewScore = (v)=>{
    document.getElementById('score-display').textContent = v;
    if(!manualOverride){
      pendingLiked = classifyByScore(parseInt(v));
      document.getElementById('btn-like').className = pendingLiked==='like'?'on-like':'';
      document.getElementById('btn-neutral').className = pendingLiked==='neutral'?'on-neutral':'';
      document.getElementById('btn-dislike').className = pendingLiked==='dislike'?'on-dislike':'';
    }
  };
  window.__toggleListFromMovie = async (listKey, movieId)=>{
    await toggleListItem(listKey, movieId);
    render();
  };
  window.__dismissFromMovie = async (movieId)=>{
    if(!confirm('Marcar como "não me interessa"? Isso remove dos seus Assistindo (se estiver lá) e baixa a % de recomendação futura pra você.')) return;
    await dismissMovieFor(state.me, movieId);
    render();
  };
  window.__shareImdbLink = async (imdbId)=>{
    const url = `https://www.imdb.com/title/${imdbId}/`;
    try{
      await navigator.clipboard.writeText(url);
      alert('Link do IMDb copiado! Já pode colar e mandar pra quem quiser.');
    }catch(e){
      prompt('Copie o link abaixo:', url);
    }
  };
  window.__toggleCheckin = (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    if(!movie.checkins) movie.checkins = {};
    movie.checkins[state.me] = movie.checkins[state.me] ? null : new Date().toISOString();
    // Se marcou assistido completo, remove abandono
    if(movie.checkins[state.me] && movie.abandonedBy && movie.abandonedBy[state.me]){
      delete movie.abandonedBy[state.me];
    }
    render();
    fbSaveMovie(movie).catch(e => console.error("Erro ao salvar check-in:", e));
  };
  window.__markAbandon = (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    let pct = 25;
    const inp = document.getElementById('abandon-pct');
    if(inp && inp.value !== ''){
      const n = parseInt(inp.value);
      if(!isNaN(n)) pct = Math.max(1, Math.min(99, n));
    } else if(movie.type==='series'){
      const sp = seriesProgressPct(movie, state.me);
      if(sp != null) pct = Math.max(1, Math.min(99, sp));
    }
    if(!movie.abandonedBy) movie.abandonedBy = {};
    movie.abandonedBy[state.me] = { at: new Date().toISOString(), pctWatched: pct };
    // Abandonar não conta como assistido completo
    if(movie.checkins && movie.checkins[state.me]) movie.checkins[state.me] = null;
    // Limpa cache de recomendação
    _recPctCache = { key: '', map: new Map() };
    render();
    fbSaveMovie(movie).catch(e => console.error("Erro ao salvar abandono:", e));
  };
  window.__clearAbandon = (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie || !movie.abandonedBy) return;
    delete movie.abandonedBy[state.me];
    _recPctCache = { key: '', map: new Map() };
    render();
    fbSaveMovie(movie).catch(e => console.error("Erro ao limpar abandono:", e));
  };
  window.__toggleEditRatings = (id)=>{
    const modal = document.querySelector('#movie-overlay .modal');
    const scrollTop = modal ? modal.scrollTop : 0;
    state._editingRatings = (state._editingRatings===id) ? null : id;
    state._editingPoster = null;
    render();
    requestAnimationFrame(()=>{
      const m2 = document.querySelector('#movie-overlay .modal');
      if(m2) m2.scrollTop = scrollTop;
      const ed = document.getElementById('ratings-editor-block');
      if(ed) ed.scrollIntoView({ block: 'nearest', behavior: 'instant' });
      const first = document.getElementById('edit-poster-url') || document.getElementById('edit-runtime');
      if(first) try{ first.focus({ preventScroll: true }); }catch(e){ first.focus(); }
    });
  };
  window.__togglePosterEdit = (id)=>{
    const modal = document.querySelector('#movie-overlay .modal');
    const scrollTop = modal ? modal.scrollTop : 0;
    state._editingPoster = (state._editingPoster===id) ? null : id;
    state._editingRatings = null;
    render();
    requestAnimationFrame(()=>{
      const m2 = document.querySelector('#movie-overlay .modal');
      if(m2) m2.scrollTop = scrollTop;
      const ed = document.getElementById('poster-editor-block');
      if(ed) ed.scrollIntoView({ block: 'nearest', behavior: 'instant' });
    });
  };
  window.__previewPosterFile = (input)=>{
    const file = input.files && input.files[0];
    if(!file) return;
    if(file.size > 900000){
      alert('Imagem grande demais (máx. ~900 KB). Use uma URL em vez de arquivo.');
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const urlInput = document.getElementById('edit-poster-url');
      if(urlInput) urlInput.value = reader.result;
    };
    reader.readAsDataURL(file);
  };
  window.__savePosterCustom = async (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    const url = (document.getElementById('edit-poster-url')?.value || '').trim();
    if(!url){ alert('Cole uma URL de imagem ou envie um arquivo.'); return; }
    movie.posterCustom = url;
    state._editingPoster = null;
    await fbSaveMovie(movie);
    render();
  };
  window.__clearPosterCustom = async (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    delete movie.posterCustom;
    state._editingPoster = null;
    await fbSaveMovie(movie);
    render();
  };
  window.__refreshExternalData = async (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    if(!state.apiKey){
      alert('Configure a chave da OMDb em Configurações antes de atualizar.');
      return;
    }
    if(!movie.imdbId){
      alert('Este título não tem ID do IMDb salvo. Reimporte pelo link do IMDb.');
      return;
    }
    try{
      const fresh = await fetchOmdb(movie.imdbId);
      mergeFreshOmdbInto(movie, fresh);
      await fbSaveMovie(movie);
      const r = movie.ratings || {};
      const msg = [
        'Notas atualizadas:',
        'IMDb: ' + (r.imdb != null ? r.imdb : '—') + (r.imdbVotes != null ? ' ('+r.imdbVotes.toLocaleString('pt-BR')+' votos)' : ''),
        'RT: ' + (r.rtCritics != null ? r.rtCritics : '—'),
        'Metacritic: ' + (r.metacritic != null ? r.metacritic : '—')
      ].join('\n');
      alert(msg);
      render();
    }catch(e){
      alert('Não consegui atualizar agora: ' + (e.message||'erro desconhecido'));
    }
  };
  window.__refreshDetailedData = async (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    if(!state.tmdbKey){
      alert('Essa checagem usa a TMDB (estreias, streaming, temporadas). Configure a chave da TMDB em Configurações primeiro.');
      return;
    }
    try{
      const details = await fetchTmdbDetails(movie.imdbId, movie.type, displayTitle(movie), movie.year);
      if(!details){
        alert('Não encontrei esse título na TMDB pra checar novidades.');
        return;
      }
      movie.tmdbId = details.tmdbId;
      movie.streaming = details.streaming;
      movie.releaseStatus = details.status;
      if(details.keywords) movie.keywords = details.keywords;
      if(movie.type==='series'){
        movie.nextEpisode = details.nextEpisode;
        movie.seasons = details.seasons;
      } else {
        movie.theatricalBR = details.theatricalBR;
      }
      movie.lastUpdatedAt = new Date().toISOString();
      await fbSaveMovie(movie);
      render();
    }catch(e){
      alert('Não consegui verificar agora: ' + (e.message||'erro desconhecido'));
    }
  };
  window.__saveExternalRatings = async (id)=>{
    const movie = state.movies.find(x=>x.id===id);
    if(!movie) return;
    if(!movie.ratings) movie.ratings = {};
    const imdb = document.getElementById('edit-imdb')?.value ?? '';
    const rtc = document.getElementById('edit-rtc')?.value ?? '';
    const mc = document.getElementById('edit-mc')?.value ?? '';
    movie.ratings.imdb = imdb!=='' ? parseFloat(imdb) : null;
    movie.ratings.rtCritics = rtc!=='' ? parseFloat(rtc) : null;
    movie.ratings.metacritic = mc!=='' ? parseFloat(mc) : null;
    // Duração
    const rt = document.getElementById('edit-runtime')?.value ?? '';
    movie.runtimeMin = rt!=='' && !isNaN(parseInt(rt)) ? parseInt(rt) : (rt==='' ? null : movie.runtimeMin);
    // Data de lançamento
    const rel = document.getElementById('edit-release')?.value ?? '';
    if(rel){
      const d = new Date(rel+'T12:00:00');
      movie.releaseDate = isNaN(d.getTime()) ? movie.releaseDate : d.toISOString();
      if(!movie.year) movie.year = String(d.getFullYear());
    }
    // Capa personalizada
    const poster = (document.getElementById('edit-poster-url')?.value || '').trim();
    if(poster) movie.posterCustom = poster;
    await fbSaveMovie(movie);
    state._editingRatings = null;
    render();
  };
  window.__saveVote = ()=>{
    const scoreInput = document.getElementById('score-slider').value;
    const score = parseInt(scoreInput);
    m.votes[state.me] = { liked: pendingLiked, score: score };
    if (!isNaN(score) && score > 0) {
      if (!m.checkins) m.checkins = {};
      if (!m.checkins[state.me]) {
        m.checkins[state.me] = new Date().toISOString();
      }
    }
    // Invalida caches de recomendação
    try{
      _profileCache = {};
      if(typeof _recPctCache !== 'undefined') _recPctCache = { key:null, map:{} };
    }catch(e){}
    // Só modal + card — sem render() do catálogo
    patchVoteUI(m, state.me);
    showVoteSavedFeedback();
    fbSaveMovie(m).catch(e => console.error("Erro ao salvar voto:", e));
  };
  window.__deleteMovie = async (id)=>{
    if(!confirm('Remover este filme só da SUA lista? Ele continua no catálogo dos outros, com os votos deles intactos.')) return;
    const movie = state.movies.find(x=>x.id===id);
    if(movie){
      if(!movie.hiddenBy) movie.hiddenBy = [];
      if(!movie.hiddenBy.includes(state.me)) movie.hiddenBy.push(state.me);
      await fbSaveMovie(movie);
    }
    state.modalMovie = null;
    render();
  };
  window.__closeMovie = ()=>{ state.modalMovie=null; render(); };
}

/* ---------- SETTINGS MODAL ---------- */
function renderSettingsModal(){
  const fam = state.family;
  document.body.insertAdjacentHTML('beforeend', `
  <div class="overlay" id="settings-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>Configurações</h2><button class="close-x" onclick="__closeSettings()">×</button></div>

      <div class="hint">
        Gratuita: acesse <b>themoviedb.org</b>, crie uma conta, vá em Configurações → API,
