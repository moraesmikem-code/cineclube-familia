      <div class="hint">${state.lastGeneralUpdateAt ? 'Última atualização geral: '+new Date(state.lastGeneralUpdateAt).toLocaleString('pt-BR') : 'Ainda não foi feita nenhuma atualização geral.'}</div>
      <div id="update-catalog-msg"></div>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="__closeSettings(); __openErrorLog();">🕘 Ver histórico de erros ${((state.updateErrorLog?state.updateErrorLog.length:0)+(state.importErrorLog?state.importErrorLog.length:0))>0 ? '('+((state.updateErrorLog?state.updateErrorLog.length:0)+(state.importErrorLog?state.importErrorLog.length:0))+')' : ''}</button>

      <div class="divider"></div>

      <button class="btn btn-ghost btn-block" onclick="__saveMembers()">Salvar nomes</button>

      <div class="divider"></div>
      <label style="margin-top:0">Você está usando este app como</label>
      <div class="identity-choices">
        ${fam.members.map(m=>`<button style="${m===state.me?'border-color:var(--gold);color:var(--gold)':''}" onclick="__switchMe('${m.replace(/'/g,"\\'")}')">${m}</button>`).join('')}

  document.getElementById('settings-overlay').addEventListener('click',(e)=>{ if(e.target.id==='settings-overlay') __closeSettings(); });

  window.__closeSettings = ()=>{ state.settingsOpen=false; render(); };

  function movieHasAnyFamilyActivity(m){
    const members = (state.family && state.family.members) || [];
    for(const name of members){
      const v = m.votes && m.votes[name];
      if(v && (v.score!=null || v.liked!=null)) return true;
      if(m.checkins && m.checkins[name]) return true;
      if(m.abandonedBy && m.abandonedBy[name]) return true;
      if(m.dismissedBy && m.dismissedBy.includes(name)) return true;
      if(m.episodeVotes && m.episodeVotes[name] && Object.keys(m.episodeVotes[name]).length) return true;
    }
    return false;
  }
  function movieInAnyList(m){
    const lists = state.lists || {};
    for(const key of Object.keys(lists)){
      const byUser = lists[key] || {};
      for(const uname of Object.keys(byUser)){
        const items = (byUser[uname] && byUser[uname].items) || [];
        if(items.some(it => it.movieId === m.id)) return true;
      }
    }
    return false;
  }
  function isHiddenForMe(m){
    return !!(m.hiddenBy && m.hiddenBy.includes(state.me));
  }
  function isUnusedByMe(m){
    if(isHiddenForMe(m)) return false; // já oculto
    const v = m.votes && m.votes[state.me];
    if(v && (v.score!=null || v.liked!=null)) return false;
    if(m.checkins && m.checkins[state.me]) return false;
    if(m.abandonedBy && m.abandonedBy[state.me]) return false;
    if(m.dismissedBy && m.dismissedBy.includes(state.me)) return false;
    return true;
  }
  function isOrphanMovie(m){
    if(movieHasAnyFamilyActivity(m)) return false;
    if(movieInAnyList(m)) return false;
    return true;
  }
  function refreshCleanupStats(){
    const el = document.getElementById('cleanup-stats');
    if(!el) return;
    let hideN = 0, orphanN = 0, hiddenAlready = 0, trainingN = 0, lowScoreN = 0;
    state.movies.forEach(m=>{
      if(m.trainingOnly) trainingN++;
      if(isHiddenForMe(m)) hiddenAlready++;
      if(isUnusedByMe(m)) hideN++;
      if(isOrphanMovie(m)) orphanN++;
      const v = m.votes && m.votes[state.me];
      if(!m.trainingOnly && v && v.score!=null && v.score < 7) lowScoreN++;
    });
    const visible = state.movies.length - trainingN;
    el.innerHTML = `Visíveis no catálogo: <b style="color:var(--cream)">${visible}</b> · Só algoritmo: <b style="color:var(--gold)">${trainingN}</b> · Ocultos pra você: <b style="color:var(--cream)">${hiddenAlready}</b><br>
      Podem ocultar: <b style="color:var(--gold)">${hideN}</b> · Podem apagar: <b style="color:var(--dislike)">${orphanN}</b> · Suas notas &lt; 7 ainda no catálogo: <b style="color:var(--gold)">${lowScoreN}</b>`;
  }
  setTimeout(refreshCleanupStats, 0);

  window.__cleanupHideMine = async ()=>{
    const targets = state.movies.filter(isUnusedByMe);
    if(!targets.length){
      document.getElementById('cleanup-msg').innerHTML = `<div class="msg-ok">Nada para ocultar — você já interagiu com todos os visíveis ou já estão ocultos.</div>`;
      return;
    }
    if(!confirm(`Ocultar ${targets.length} título(s) da SUA lista?\n\nEles continuam no catálogo dos outros e no Firebase. Só somem para você.`)) return;
    const msg = document.getElementById('cleanup-msg');
    msg.innerHTML = `<div class="hint">Ocultando ${targets.length}…</div>`;
    for(const m of targets){
      if(!m.hiddenBy) m.hiddenBy = [];
      if(!m.hiddenBy.includes(state.me)) m.hiddenBy.push(state.me);
    }
    try{
      await fbSaveMoviesBatch(targets);
      try{ saveMoviesCache(state.movies); }catch(e){}
      try{ initRecWorkerData(); }catch(e){}
      msg.innerHTML = `<div class="msg-ok">${targets.length} título(s) ocultos da sua lista.</div>`;
      refreshCleanupStats();
    }catch(e){
      msg.innerHTML = `<div class="msg-error">Erro ao salvar: ${escapeHtml(e.message||String(e))}</div>`;
    }
  };

  window.__cleanupTrainingLowScores = async ()=>{
    const targets = state.movies.filter(m=>{
      if(m.trainingOnly) return false;
      const v = m.votes && m.votes[state.me];
      return v && v.score!=null && v.score < 7;
    });
    if(!targets.length){
      document.getElementById('cleanup-msg').innerHTML = `<div class="msg-ok">Nenhum título seu com nota &lt; 7 ainda no catálogo.</div>`;
      return;
    }
    if(!confirm(`Mover ${targets.length} título(s) com a sua nota menor que 7 para “só algoritmo”?\n\nSomem do catálogo, mas as notas continuam no Firebase e no algoritmo. Não apaga nada.`)) return;
    const msg = document.getElementById('cleanup-msg');

    }
  };
  window.__dedupeCatalog = async ()=>{
    const byImdb = {};
    state.movies.forEach(m=>{
      if(!byImdb[m.imdbId]) byImdb[m.imdbId] = [];
      byImdb[m.imdbId].push(m);
    });
    let merged = 0;
    const survivors = [];
    const removedIds = [];
    const changedMains = [];
    Object.values(byImdb).forEach(group=>{
      if(group.length===1){ survivors.push(group[0]); return; }
      const main = group[0];
      for(let i=1;i<group.length;i++){
        const dup = group[i];
        state.family.members.forEach(name=>{
          if((!main.votes[name] || main.votes[name].score==null) && dup.votes[name] && dup.votes[name].score!=null){
            main.votes[name] = dup.votes[name];
          }
          if((!main.checkins || !main.checkins[name]) && dup.checkins && dup.checkins[name]){
            if(!main.checkins) main.checkins = {};
            main.checkins[name] = dup.checkins[name];
          }
        });
        removedIds.push(dup.id);
        merged++;
      }
      changedMains.push(main);
      survivors.push(main);
    });
    state.movies = survivors;
    if(changedMains.length) await fbSaveMoviesBatch(changedMains);
    for(const id of removedIds){ try{ await fbDeleteMovie(id); }catch(e){ console.error('erro ao apagar duplicado', e); } }
    const msgEl = document.getElementById('dedupe-msg');
    msgEl.innerHTML = merged>0
      ? `<div class="msg-ok">${merged} duplicado(s) encontrados e fundidos — os votos foram preservados.</div>`
      : `<div class="msg-ok">Nenhum duplicado encontrado. Catálogo já está limpo.</div>`;
  };
  async function runCatalogUpdate(mode){
    // mode: 'all' | 'optimized'
    if(!state.apiKey){
      document.getElementById('update-catalog-msg').innerHTML = `<div class="msg-error">Configure a chave da OMDb primeiro.</div>`;
      return;
    }
    state.catalogUpdateCancelled = false;
    const msgEl = document.getElementById('update-catalog-msg');

    const now = Date.now();
    const yearMs = 365 * 24 * 60 * 60 * 1000;
    function needsFrequentUpdate(m){
      if(m.type === 'series'){
        const st = (m.releaseStatus || '').toLowerCase();
        if(st && /end|cancel|pilot/.test(st)) return false;
        return true;
      }
      if(m.releaseDate){
        const t = new Date(m.releaseDate).getTime();
        if(!isNaN(t) && (now - t) <= yearMs) return true;
      }
      const y = parseInt(m.year);
      if(!isNaN(y) && y >= new Date().getFullYear() - 1) return true;
      return false;
    }

    const progressKey = mode === 'optimized'
      ? 'cineclube-catalog-update-progress-opt'
      : 'cineclube-catalog-update-progress';

    let processedIds = new Set();
    try{
      const raw = localStorage.getItem(progressKey);
      if(raw) processedIds = new Set(JSON.parse(raw));
    }catch(e){}

    const pool = mode === 'optimized'
      ? state.movies.filter(needsFrequentUpdate)
      : state.movies.slice();

    // Se existe progresso incompleto, pergunta o que fazer
    if(processedIds.size > 0){
      const remaining = pool.filter(m=>!processedIds.has(m.id)).length;
      if(remaining > 0){
        const choice = await new Promise(resolve=>{
          msgEl.innerHTML = `
            <div class="hint">Há uma atualização incompleta neste modo:<br>
              <b style="color:var(--cream)">${processedIds.size}</b> já processados · faltam cerca de <b style="color:var(--cream)">${remaining}</b>.</div>
            <div class="field-inline" style="margin-top:10px;gap:8px">
              <button class="btn btn-gold btn-sm" style="flex:1" id="upd-continue">▶ Continuar de onde parou</button>
              <button class="btn btn-ghost btn-sm" style="flex:1" id="upd-restart">↺ Recomeçar do zero</button>
            </div>
            <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" id="upd-cancel">Cancelar</button>`;
          document.getElementById('upd-continue').onclick = ()=>resolve('continue');
          document.getElementById('upd-restart').onclick = ()=>resolve('restart');
          document.getElementById('upd-cancel').onclick = ()=>resolve('cancel');
        });
        if(choice === 'cancel'){
          msgEl.innerHTML = `<div class="hint">Atualização cancelada.</div>`;
          return;
        }
        if(choice === 'restart'){
          processedIds = new Set();
          try{ localStorage.removeItem(progressKey); }catch(e){}
        }
      } else {
        // Progresso antigo já cobre tudo — limpa e recomeça
        processedIds = new Set();
        try{ localStorage.removeItem(progressKey); }catch(e){}
      }
    }

    let updated = 0, errors = 0, stopped = false, cancelled = false;
    const failedTitles = [];
    const toProcess = pool.filter(m=>!processedIds.has(m.id));
    const alreadyDone = processedIds.size;
    if(mode === 'optimized'){
      msgEl.innerHTML = `<div class="hint">Modo otimizado: ${pool.length} títulos elegíveis (séries ativas + filmes ≤ 1 ano). Processando ${toProcess.length}…</div>`;
      await new Promise(res=>setTimeout(res, 500));
    } else if(alreadyDone > 0){
      msgEl.innerHTML = `<div class="hint">Continuando: ${alreadyDone} já feitos, faltam ${toProcess.length}.</div>`;
      await new Promise(res=>setTimeout(res, 500));
    }

    try{
      for(let i=0;i<toProcess.length;i++){
        if(state.catalogUpdateCancelled){ cancelled = true; break; }
        msgEl.innerHTML = `<div class="hint">Atualizando ${i+1}/${toProcess.length} elegíveis... (${updated} ok, ${errors} erro)</div>
          <button class="btn btn-danger btn-sm" style="margin-top:6px" onclick="__cancelCatalogUpdate()">⏹ Parar atualização</button>`;
        const movie = toProcess[i];
        try{
          const fresh = await fetchOmdb(movie.imdbId);
          mergeFreshOmdbInto(movie, fresh);
          if(state.tmdbKey){
            try{
              const details = await fetchTmdbDetails(movie.imdbId, movie.type, displayTitle(movie), movie.year);
              if(details){
                movie.tmdbId = details.tmdbId;
                movie.streaming = details.streaming;
                movie.releaseStatus = details.status;
                if(details.keywords) movie.keywords = details.keywords;
                if(movie.type==='series'){ movie.nextEpisode = details.nextEpisode; movie.seasons = details.seasons; }
                else { movie.theatricalBR = details.theatricalBR; }
                movie.lastUpdatedAt = new Date().toISOString();
              }
            }catch(e2){ /* TMDB falhou nesse título, segue o baile só com a OMDb */ }
          }
          await fbSaveMovie(movie);
          updated++;
        }catch(e){
          errors++;
          failedTitles.push({ title: displayTitle(movie), year: movie.year, imdbId: movie.imdbId });
          if(/limit|429|quota/i.test(e.message||'')){ stopped = true; break; }
        }
        processedIds.add(movie.id);
        try{ localStorage.setItem(progressKey, JSON.stringify(Array.from(processedIds))); }catch(e){}
        await new Promise(res=>setTimeout(res, 350));
      }
    }catch(fatalErr){
      msgEl.innerHTML = `<div class="msg-error">Erro inesperado: ${escapeHtml(fatalErr.message || String(fatalErr))}</div><div class="hint">O que já foi feito está salvo — toque no mesmo botão de novo pra continuar de onde parou.</div>`;
      return;
    }
    if(!stopped && !cancelled){
      if(mode === 'all'){
        state.lastGeneralUpdateAt = new Date().toISOString();
        await sSet('last-general-update', state.lastGeneralUpdateAt, true);
      }
      try{ localStorage.removeItem(progressKey); }catch(e){}
    }
    if(failedTitles.length){
      if(!state.updateErrorLog) state.updateErrorLog = [];
      state.updateErrorLog.unshift({ at: new Date().toISOString(), titles: failedTitles });
      state.updateErrorLog = state.updateErrorLog.slice(0,10);
      await sSet('update-error-log', JSON.stringify(state.updateErrorLog), true);
    }
    const modeLabel = mode === 'optimized' ? 'Atualização otimizada' : 'Catálogo completo';
    msgEl.innerHTML = (cancelled
      ? `<div class="msg-error">Atualização interrompida por você. Progresso salvo — toque no mesmo botão de novo pra continuar.</div>`
      : stopped
      ? `<div class="msg-error">Parei — provavelmente bati o limite diário da OMDb. Progresso salvo, tenta de novo amanhã pra continuar de onde parou.</div>`
      : `<div class="msg-ok">${modeLabel}: ${updated} títulos, ${errors} erro(s).</div>`)
      + (failedTitles.length ? `<div class="hint" style="margin-top:6px">Títulos com erro: ${failedTitles.map(t=>escapeHtml(t.title+(t.year?' ('+t.year+')':''))).join(', ')} — veja também em "🕘 Ver erros das últimas atualizações".</div>` : '');
  }
  window.__updateCatalogAll = ()=> runCatalogUpdate('all');
  window.__updateCatalogOptimized = ()=> runCatalogUpdate('optimized');
  window.__cancelCatalogUpdate = ()=>{ state.catalogUpdateCancelled = true; };
  window.__saveKey = async ()=>{
    const val = document.getElementById('api-key-input').value.trim();
    const res = await sSet('omdb-key', val, true);
    state.apiKey = val;
    document.getElementById('key-msg').innerHTML = res.ok ? `<div class="msg-ok">Chave salva!</div>` : `<div class="msg-error">Erro: ${escapeHtml(res.error)}</div>`;
  };
  window.__saveTmdbKey = async ()=>{
    const val = document.getElementById('tmdb-key-input').value.trim();
    const res = await sSet('tmdb-key', val, true);
    state.tmdbKey = val;
    document.getElementById('tmdb-key-msg').innerHTML = res.ok ? `<div class="msg-ok">Chave salva!</div>` : `<div class="msg-error">Erro: ${escapeHtml(res.error)}</div>`;
  };
  window.__saveMembers = async ()=>{
    const names = fam.members.map((_,i)=>document.getElementById('mem-'+i).value.trim()).filter(Boolean);
    if(names.length < 1) return;
    state.family = { members: names };
    saveFamilyCache(state.family);
    await sSet('family-config', JSON.stringify(state.family), true);
    render();
  };
  window.__switchMe = async (name)=>{
    await sSet('my-identity', name, false);
    state.me = name;
    render();
  };
}

/* ---------- RECOMENDAÇÕES ---------- */
function runtimeBucket(min){
  if(min==null) return null;
  if(min<90) return 'curto (<90min)';
  if(min<=120) return 'médio (90-120min)';
  if(min<=150) return 'longo (120-150min)';
  return 'muito longo (150min+)';
}

let _profileCache = {};
function buildTasteProfile(person, excludeId){
  let ratedCount = 0;
  state.movies.forEach(m=>{
    const v = m.votes[person];
    if((v && v.score!=null) || (m.dismissedBy && m.dismissedBy.includes(person))) ratedCount++;
  });
  const cacheKey = person + ':' + ratedCount;
  if(!_profileCache[cacheKey]){
    _profileCache = {}; // troca de pessoa/contagem: descarta cache antigo (evita crescer sem limite)
    _profileCache[cacheKey] = buildTasteProfileRaw(person, null);
  }
  const base = _profileCache[cacheKey];
  if(excludeId==null) return base;
  // só refaz do zero (mais caro) se o filme excluído realmente participa do perfil dessa pessoa
  const excludedMovie = state.movies.find(m=>m.id===excludeId);
  const participates = excludedMovie && (
    (excludedMovie.votes[person] && excludedMovie.votes[person].score!=null) ||
    (excludedMovie.dismissedBy && excludedMovie.dismissedBy.includes(person))
  );
  if(!participates) return base;
  return buildTasteProfileRaw(person, excludeId);
}

// Detecta mesma franquia/sequência pelo título (ex.: Tropa de Elite / Tropa de Elite 2)
function franchiseRoot(m){
  let t = displayTitle(m) || m.title || m.titleEn || m.titleOriginal || '';
  t = String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  t = t.replace(/:\s*.+$/, ''); // remove subtítulo após :
  t = t.replace(/\s*[-–—]\s*.+$/, '');
  t = t.replace(/\b(part|parte|chapter|capitulo|capítulo|volume|vol\.?)\s*\d+\b/g, '');
  t = t.replace(/\b(ii|iii|iv|v|vi|vii|viii|ix|x|\d+)\b/g, '');
  t = t.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  // primeiros tokens significativos (evita raiz vazia)
  const words = t.split(' ').filter(w => w.length > 1);
  return words.slice(0, 4).join(' ');
}
function sameFranchise(a, b){
  if(!a || !b || a.id === b.id) return false;
  const ra = franchiseRoot(a), rb = franchiseRoot(b);
  if(!ra || !rb || ra.length < 5 || rb.length < 5) return false;
  if(ra === rb) return true;
  if(ra.includes(rb) || rb.includes(ra)) return true;
  // mesmo diretor + títulos muito parecidos
  const da = (a.director||'').toLowerCase().split(',')[0].trim();
  const db = (b.director||'').toLowerCase().split(',')[0].trim();
  if(da && db && da === db){
    const wa = ra.split(' '), wb = rb.split(' ');
    const common = wa.filter(w => wb.includes(w));
    if(common.length >= 2) return true;
  }
  return false;
}

function buildTasteProfileRaw(person, excludeId){
  const maps = { genre:{}, director:{}, actor:{}, writer:{}, country:{}, decade:{}, studio:{}, genreDecade:{}, genreCountry:{}, genreDecadeCountry:{}, keyword:{}, runtime:{} };
  let count = 0;
  const target = excludeId ? state.movies.find(x => x.id === excludeId) : null;
  function bump(map, key, w){
    if(!map[key]) map[key] = { sum:0, n:0 };
    map[key].sum += w;
    map[key].n += 1;
  }
  function applyMovie(m, w){
    const decade = m.year ? Math.floor(parseInt(m.year)/10)*10 : null;
    (m.genres||[]).forEach(g=>{
      bump(maps.genre, g, w);
      if(decade!=null) bump(maps.genreDecade, g+'|'+decade, w);
      (m.countries||[]).forEach(c=>{
        bump(maps.genreCountry, g+'|'+c, w);
        const cont = countryToContinent(c);
        if(cont) bump(maps.genreCountry, g+'|cont:'+cont, w);
        if(decade!=null) bump(maps.genreDecadeCountry, g+'|'+decade+'|'+c, w);
      });
    });
    if(m.director) m.director.split(',').map(s=>s.trim()).forEach(d=>bump(maps.director, d, w));
    if(m.writer) m.writer.split(',').map(s=>s.trim()).forEach(wr=>bump(maps.writer, wr, w));
    if(m.actors) m.actors.split(',').map(s=>s.trim()).forEach(a=>bump(maps.actor, a, w));
    (m.countries||[]).forEach(c=>bump(maps.country, c, w));
    if(decade!=null) bump(maps.decade, decade, w);
    if(m.production) bump(maps.studio, m.production, w);
    (m.keywords||[]).forEach(k=>{
      const kk = String(k).toLowerCase().trim();
      if(kk) bump(maps.keyword, kk, w);
    });
    const rb = runtimeBucket(m.runtimeMin);
    if(rb) bump(maps.runtime, rb, w);
  }
  state.movies.forEach(m=>{
    if(m.id === excludeId) return;
    // Franquia/sequência: a nota de um não deve dominar a previsão do outro
    const franchiseMul = (target && sameFranchise(m, target)) ? 0.15 : 1;
    const v = m.votes[person];
    if(v && v.score!=null){
      count++;
      applyMovie(m, (v.score - 5.5) * franchiseMul);
    } else if(m.abandonedBy && m.abandonedBy[person]){
      const pct = m.abandonedBy[person].pctWatched;
      const eq = abandonToScore(pct);
      count++;
      applyMovie(m, (eq - 5.5) * 0.7 * franchiseMul);
    } else if(m.dismissedBy && m.dismissedBy.includes(person)){
      applyMovie(m, -2.5 * franchiseMul);
    }
  });
  return { maps, count };
}

let _crossAffinityCache = {};
function crossUserAffinity(personA, personB){
  const cacheKey = personA+'|'+personB+':'+state.movies.length;
  if(_crossAffinityCache[cacheKey]!==undefined) return _crossAffinityCache[cacheKey];
  const common = state.movies.filter(m=>{
    const a=m.votes[personA], b=m.votes[personB];
    return a && a.score!=null && b && b.score!=null;
  });
  let result;
  if(common.length < 3){ result = 0; } // exige mais filmes em comum antes de confiar na afinidade
  else {
    let sum=0;
    common.forEach(m=>{
      const diff = Math.abs(m.votes[personA].score - m.votes[personB].score);
      sum += (1 - diff/9);
    });
    const raw = (sum/common.length)*2 - 1; // -1..1
    const confidence = Math.min(1, common.length/8); // precisa de ~8 filmes em comum pra confiança máxima
    result = raw * confidence;
  }
  if(Object.keys(_crossAffinityCache).length > 200) _crossAffinityCache = {};
  _crossAffinityCache[cacheKey] = result;
  return result;
}

// Afinidade entre duas pessoas, mas específica pro contexto do filme (gênero, década, país) —
// já que duas pessoas podem concordar em comédia e discordar em terror, por exemplo.
function segmentAffinity(personA, personB, filterFn){
  const common = state.movies.filter(m=>{
    const a=m.votes[personA], b=m.votes[personB];
    return a && a.score!=null && b && b.score!=null && filterFn(m);
  });
  if(common.length < 2) return null;
  let sum=0;
  common.forEach(m=>{
    const diff = Math.abs(m.votes[personA].score - m.votes[personB].score);
    sum += (1 - diff/9);
  });
  const raw = (sum/common.length)*2 - 1;
  const confidence = Math.min(1, common.length/5);
  return { value: raw*confidence, n: common.length };
}

function crossUserAffinityFor(personA, personB, movie){
  const overall = crossUserAffinity(personA, personB);
  const decade = movie.year ? Math.floor(parseInt(movie.year)/10)*10 : null;
  const segments = [];
  (movie.genres||[]).forEach(g=>{
    const s = segmentAffinity(personA, personB, m=>(m.genres||[]).includes(g));
    if(s) segments.push(s);
  });
  if(decade!=null){
    const s = segmentAffinity(personA, personB, m=>{ const y=parseInt(m.year); return !isNaN(y) && Math.floor(y/10)*10===decade; });
    if(s) segments.push(s);
  }
  (movie.countries||[]).forEach(c=>{
    const s = segmentAffinity(personA, personB, m=>(m.countries||[]).includes(c));
    if(s) segments.push(s);
  });
  // combina: afinidade geral como "base" (peso 1) + cada afinidade específica pesada pelo quanto de dado ela tem
  let weightedSum = overall * 1;
  let totalWeight = 1;
  segments.forEach(s=>{
    const w = Math.min(3, s.n/2);
    weightedSum += s.value * w;
    totalWeight += w;
  });
  return weightedSum / totalWeight;
}

// Shrinkage por feature: k menor = confia mais rápido; k maior = exige mais repetições.
// Diretor/atores = sinal causal forte; estúdio/roteirista = mais ruidoso.
const SHRINK_K_BY_FEATURE = {
  director: 2.0,
  actor: 2.5,
  writer: 5.0,
  studio: 6.0,
  country: 3.0,
  decade: 3.0,
  genreDecade: 3.5,
  genreCountry: 3.5,
  genreDecadeCountry: 4.0,
  keyword: 4.0, // subgênero/tema (slasher, time travel…) — precisa de algumas repetições
  default: 3.0
};
function shrunkWeight(entry, feature){
  if(!entry || entry.n===0) return 0;
  const k = SHRINK_K_BY_FEATURE[feature] ?? SHRINK_K_BY_FEATURE.default;
  const avg = entry.sum / entry.n;
  const confidence = entry.n / (entry.n + k);
  return avg * confidence;
}

// Abandono → nota equivalente (proxy). Quanto mais cedo parou, mais negativo.
// 15% ≈ 2,3 · 60% ≈ 4,5 · 90% ≈ 6,0
function abandonToScore(pctWatched){
  const p = Math.max(0, Math.min(100, pctWatched == null ? 25 : Number(pctWatched))) / 100;
  return 1.5 + p * 5;
}
// Progresso de série a partir de episódios marcados
function seriesProgressPct(movie, person){
  const seasons = movie.seasons || [];
  let total = 0;
  seasons.forEach(s=>{ total += (s.episodeCount || 0); });
  if(total <= 0) return null;
  const votes = (movie.episodeVotes && movie.episodeVotes[person]) || {};
  let watched = 0;
  Object.keys(votes).forEach(k=>{ if(votes[k] && votes[k].watched) watched++; });
  return Math.round(100 * watched / total);
}

// Sinal "cru" — padrões de gosto (pessoas, país, década, combinações de gênero…).
function rawTasteSignal(movie, maps){
  let raw = 0, maxPossible = 0.0001;
  function add(map, keys, weightMul, feature){
    keys.forEach(k=>{
      const entry = map[k];
      if(!entry || entry.n===0) return;
      const eff = shrunkWeight(entry, feature);
      raw += eff*weightMul;
      maxPossible += (Math.abs(eff)+1)*weightMul;
    });
  }
  const decade = movie.year ? Math.floor(parseInt(movie.year)/10)*10 : null;
  // Gênero sozinho = 0. Combinações com década/país/continente = sim.
  add(maps.genre, movie.genres||[], 0, 'default');
  if(movie.director) add(maps.director, movie.director.split(',').map(s=>s.trim()), 1.4, 'director');
  if(movie.writer) add(maps.writer, movie.writer.split(',').map(s=>s.trim()), 1.0, 'writer');
  if(movie.actors) add(maps.actor, movie.actors.split(',').map(s=>s.trim()), 1.2, 'actor');
  add(maps.country, movie.countries||[], 0.8, 'country');
  if(decade!=null) add(maps.decade, [decade], 0.8, 'decade');
  if(movie.production) add(maps.studio, [movie.production], 0.7, 'studio');
  if(decade!=null) add(maps.genreDecade, (movie.genres||[]).map(g=>g+'|'+decade), 1.3, 'genreDecade');
  (movie.countries||[]).forEach(c=>{
    add(maps.genreCountry, (movie.genres||[]).map(g=>g+'|'+c), 1.1, 'genreCountry');
    const cont = countryToContinent(c);
    if(cont) add(maps.genreCountry, (movie.genres||[]).map(g=>g+'|cont:'+cont), 1.0, 'genreCountry');
    // Tríplice: gênero + década + país (ex.: terror americano anos 70)
    if(decade!=null){
      add(maps.genreDecadeCountry, (movie.genres||[]).map(g=>g+'|'+decade+'|'+c), 1.4, 'genreDecadeCountry');
    }
  });
  // Keywords TMDB ≈ tags de subgênero/tema do IMDb (slasher, based on novel, time travel…)
  if(movie.keywords && movie.keywords.length){
    const kws = movie.keywords.map(k=>String(k).toLowerCase().trim()).filter(Boolean);
    add(maps.keyword, kws, 1.15, 'keyword');
  }
  return { raw, maxPossible };
}

function pearson(xs, ys){
  const n = xs.length;
  if(n < 2) return 0;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, dx2=0, dy2=0;
  for(let i=0;i<n;i++){
    const dx=xs[i]-mx, dy=ys[i]-my;
    num += dx*dy; dx2 += dx*dx; dy2 += dy*dy;
  }
  if(dx2===0||dy2===0) return 0;
  return num/Math.sqrt(dx2*dy2);
}

// Auto-validação: esconde cada filme já avaliado, um de cada vez, prevê com o resto,
// e compara com a nota real dada — pra saber se o modelo é realmente confiável pra essa pessoa.
let _backtestCache = {};
function backtestAccuracy(person){
  const rated = state.movies.filter(m=>m.votes[person] && m.votes[person].score!=null);
  const cacheKey = person+':'+rated.length;
  if(_backtestCache[cacheKey]) return _backtestCache[cacheKey];
  if(rated.length < 8){
    const result = { corr: 0.35, n: rated.length }; // poucos dados: confiança moderada, não extrema
    _backtestCache[cacheKey] = result;
    return result;
  }
  const preds = [], actuals = [];
  rated.forEach(m=>{
    const { maps, count } = buildTasteProfile(person, m.id);
    if(count < 5) return;
    const { raw, maxPossible } = rawTasteSignal(m, maps);
    preds.push(raw/maxPossible);
    actuals.push(m.votes[person].score - 5.5);
  });
  const result = preds.length >= 6 ? { corr: pearson(preds, actuals), n: preds.length } : { corr: 0.35, n: preds.length };
  _backtestCache[cacheKey] = result;
  return result;
}

let _alignCache = {};
function aggregatorAlignment(person){
  const rated = state.movies.filter(m=>m.votes[person] && m.votes[person].score!=null);
  const cacheKey = person+':'+rated.length;
  if(_alignCache[cacheKey]) return _alignCache[cacheKey];
  function corrWith(getter){
    const xs=[], ys=[];
    rated.forEach(m=>{
      const ext = getter(m);
      if(ext==null) return;
      xs.push(m.votes[person].score);
      ys.push(ext);
    });
    if(xs.length<4) return 0;
    return pearson(xs,ys);
  }
  const result = {
    imdbCorr: corrWith(m=>m.ratings && m.ratings.imdb),
    criticCorr: corrWith(m=>{
      if(!m.ratings) return null;
      const vals=[m.ratings.rtCritics, m.ratings.metacritic].filter(v=>v!=null);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    })
  };
  _alignCache[cacheKey] = result;
  return result;
}

function _normTxt(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function isForcedCommiePenalty(movie){
  const id = String(movie.imdbId || movie.id || '').toLowerCase();
  if(COMMIE_FORCE_PENALTY_IMDB.has(id)) return true;
  const titles = [movie.titlePt, movie.titleEn, movie.titleOriginal, movie.title, displayTitle(movie)]
    .filter(Boolean).map(t => _normTxt(t));
  if(COMMIE_FORCE_PENALTY_TITLES.some(needle => {
    const n = _normTxt(needle);
    return titles.some(t => t === n || t.includes(n));
  })) return true;

  // Diretores associados a certo cinema político
  const dir = _normTxt(movie.director || '');
  if(dir && POLITICAL_LEFT_DIRECTORS.some(d => dir.includes(_normTxt(d)))) return true;

  const countries = (movie.countries || []).map(c => _normTxt(c));
  const isBR = countries.some(c => c.includes('brasil') || c.includes('brazil'));
  const genres = (movie.genres || []).map(g => _normTxt(g));
  const isDoc = genres.some(g => g.includes('document'));
  const year = parseInt(movie.year);
  const isContemporary = !isNaN(year) && year >= 2010;
  const kwList = (movie.keywords || []).map(k => _normTxt(k));
  const text = _normTxt((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + kwList.join(' '));

  const hasLeftTheme = POLITICAL_LEFT_THEME_KW.some(k => {
    const n = _normTxt(k);
    return kwList.some(kw => kw.includes(n) || n.includes(kw)) || text.includes(n);
  });
  // Tom de denúncia (sinopse)
  const hasDenuncia = /\b(denuncia|denúncia|injustica|injustiça|resistencia|resistência|oppress|opressao|opressão|golpe|lawfare|persecu|autoritarismo)\b/i.test(text);

  // Documentário político contemporâneo brasileiro + tema/denúncia
  if(isBR && isDoc && isContemporary && (hasLeftTheme || hasDenuncia)) return true;

  // Brasil + (impeachment/Lula/PT/ditadura) + tom de denúncia
  if(isBR && hasLeftTheme && hasDenuncia) return true;

  // Heurística crítica × público (Tropa 1 vs Tropa 2):
  // Filme político/BR + crítica alta (RT ≥ 8 ou média ≥ 7.5) → pró-esquerda.
  // Tropa 1: RT 5.3 → não penaliza | Tropa 2: RT 9.1 / Meta 7.1 → penaliza
  {
    const rt = movie.ratings && movie.ratings.rtCritics != null ? Number(movie.ratings.rtCritics) : null;
    const meta = movie.ratings && movie.ratings.metacritic != null ? Number(movie.ratings.metacritic) : null;
    const criticVals = [rt, meta].filter(v => v != null && !isNaN(v));
    const criticAvg = criticVals.length ? criticVals.reduce((a,b)=>a+b,0) / criticVals.length : null;
    const looksPolitical = hasLeftTheme || hasDenuncia
      || /\b(politic|politica|policial|corrup|congress|senado|partido|eleic|ditadura|military)\b/i.test(text)
      || genres.some(g => /politic|crime|police|policial/.test(g));
    if(isBR && looksPolitical && criticAvg != null){
      if((rt != null && rt >= 8.0) || criticAvg >= 7.5) return true;
    }
  }

  return false;
}

function estimateAffinity(movie, person){
  try {
  const { maps, count } = buildTasteProfile(person, movie.id);
  if(count < 6) return { ready:false, pct:50 };

  const { raw:tasteRaw, maxPossible:tasteMax } = rawTasteSignal(movie, maps);
  let raw = tasteRaw, maxPossible = tasteMax;

  // Camada de segurança: consenso de crítica externa, mas pesado por qual agregador mais "bate" com você
  // (algumas pessoas concordam mais com o público do IMDb, outras com a crítica do Metacritic/RT)
  const align = aggregatorAlignment(person);
  const ratings = movie.ratings || {};
  const imdbVal = ratings.imdb;
  const imdbVotes = ratings.imdbVotes;
  const rtVal = ratings.rtCritics;
  const metaVal = ratings.metacritic;

  // Qualidade externa em 2 camadas.
  // (A) IMDb alto + crítica baixa → IMDb puro (Tropa 1)
  // (B) político + crítica alta → só IMDb, sem prêmio de establishment (Tropa 2)
  let extScore = null;
  let discardedCriticsLow = false;
  {
    let criticVals = [];
    if (rtVal != null) criticVals.push(Number(rtVal));
    if (metaVal != null) criticVals.push(Number(metaVal));
    let criticAvg = criticVals.length
      ? criticVals.reduce((a,b)=>a+b,0) / criticVals.length
      : null;

    const textPol = ((movie.synopsisPt||'')+' '+(movie.plot||'')+' '+(movie.keywords||[]).join(' ')+' '+(movie.genres||[]).join(' ')+' '+(movie.director||'')).toLowerCase();
    const looksPolitical = /\b(politic|política|policial|corrup|congress|partido|eleic|ditadura|military|crime|police|impeachment|lula|dilma)\b/i.test(textPol)
      || (movie.genres||[]).some(g => /politic|crime|police|policial|document/i.test(String(g)));

    if (criticAvg != null && imdbVal != null) {
      const imdbN = Number(imdbVal);
      const criticsLow = imdbN >= 7.0 && criticAvg <= imdbN - 1.2;
      const criticsHigh = looksPolitical && (criticAvg >= 7.5 || (rtVal != null && Number(rtVal) >= 8.0));
      if (criticsLow) {
        criticAvg = null;
        discardedCriticsLow = true;
      } else if (criticsHigh) {
        criticAvg = null;
      }
    }

    if (discardedCriticsLow && imdbVal != null) {
      // Qualidade = IMDb puro, sem diluir com nada
      extScore = Number(imdbVal);
    } else {
      let sum = 0, wSum = 0;
      const CRITIC_W = 1.0;
      const IMDB_BASE_W = 2.0;
      if (imdbVal != null) {
        let imdbW = IMDB_BASE_W;
        if (imdbVotes != null) {
          imdbW = Math.min(4.0, IMDB_BASE_W + Math.log10(imdbVotes + 1) / 3);
        }
        if (criticAvg == null) imdbW = Math.max(imdbW, 3.0);
        sum += Number(imdbVal) * imdbW;
        wSum += imdbW;
      }
      if (criticAvg != null) {
        let cW = CRITIC_W;
        if (imdbVal != null && Math.abs(Number(imdbVal) - criticAvg) > 1.5) cW *= 0.5;
        sum += criticAvg * cW;
        wSum += cW;
      }
      if (wSum > 0) extScore = sum / wSum;
    }
  }
  const hasExtPenaltyCountry = (movie.countries || []).some(c => PENALTY_COUNTRIES.has(c));

  state.family.members.forEach(other=>{
    if(other===person) return;
    const v = movie.votes[other];
    if(!v || v.score==null) return;
    const affinity = crossUserAffinityFor(person, other, movie);
    if(affinity===0) return;
    const contribution = (v.score-5.5) * affinity * 0.9;
    raw += contribution;
    maxPossible += Math.abs(contribution) + 1;
  });

  const { corr } = backtestAccuracy(person);
  const reliability = Math.max(0.15, corr);

  // --- % baseada no gosto (diretor, ator, país, década…) ---
  // Piso de confiança mais alto: corr 0.19 não deve esmagar a variação.
  let fatorConfianca = Math.max(0.70, Math.sqrt(reliability));
  const sinalCru = (maxPossible > 0) ? (raw / maxPossible) : 0;
  let diferencaDoMeio = (sinalCru * 100) - 50;
  // Amplificador forte para separar "amei" de "ok"
  let amplificador = 4.0;
  let tastePctRaw = 50 + (diferencaDoMeio * fatorConfianca * amplificador);
  // Evidência: maxPossible baixo → não inventa preferência
  const tasteEvidence = Math.max(0, Math.min(1, maxPossible / 10));
  let tastePct = 50 + (tastePctRaw - 50) * tasteEvidence;

  // --- % baseada na qualidade externa — impacto DIRETO ---
  // Cada ponto acima/abaixo de 6.5 move ~11 pontos (mais espalhado).
  let qualityPct = 50;
  if (extScore != null && !hasExtPenaltyCountry) {
    qualityPct = 50 + (extScore - 6.5) * 11;
    let qualityConf = 1;
    if (discardedCriticsLow) {
      // Crítica hostil descartada: confia no IMDb (público) sem amortecer
      qualityConf = 1;
    } else if (imdbVal == null) {
      qualityConf = 0.25;
    } else if (imdbVotes != null) {
      qualityConf = Math.min(1, Math.log10(imdbVotes + 1) / 4.7);
      qualityConf = Math.max(0.20, qualityConf);
    } else {
      qualityConf = 0.45;
    }
    qualityPct = 50 + (qualityPct - 50) * qualityConf;
  }

  // Curva contínua (sigmoide) do peso gosto × evidência — sem degraus.
  // Evidência 0 → ~15% gosto; evidência 1 → ~35% gosto.
  // A confiança do gosto já multiplica: sinal fraco pesa menos sozinho.
  function sigmoid01(x){
    // centra em 0.5, suave
    return 1 / (1 + Math.exp(-8 * (x - 0.5)));
  }
  const PesoMin = 0.15, PesoMax = 0.35;
  let tasteWeight = PesoMin + (PesoMax - PesoMin) * sigmoid01(tasteEvidence);
  // Peso do gosto também escala com a confiança do modelo (corr)
  tasteWeight *= Math.max(0.55, fatorConfianca);
  if (imdbVal == null) {
    // Sem IMDb: não deixa crítica isolada dominar
    tasteWeight = Math.max(tasteWeight, 0.30);
  }
  // Garante faixa útil
  tasteWeight = Math.max(0.10, Math.min(0.45, tasteWeight));
  // Quando a crítica hostil foi descartada, o IMDb manda: reduz peso do gosto
  // (evita a nota 6 da sequência no mesmo diretor afundar o original no leave-one-out)
  if (discardedCriticsLow) {
    tasteWeight = Math.min(tasteWeight, 0.12);
  }
  const qualityWeight = 1 - tasteWeight;
  let pctFinal = tastePct * tasteWeight + qualityPct * qualityWeight;

  // Esticamento ASSIMÉTRICO
  if (pctFinal >= 50) {
    pctFinal = 50 + (pctFinal - 50) * 2.0;
  } else {
    pctFinal = 50 + (pctFinal - 50) * 1.15;
  }
  pctFinal = Math.max(5, Math.min(95, pctFinal));

  // Penalidades adicionais de origem e temática
  const hasPenaltyCountry = (movie.countries || []).some(c => PENALTY_COUNTRIES.has(c));
  if (hasPenaltyCountry) {
    pctFinal = pctFinal * 0.8; // diminui 20%
  }

  // Volume por país: se o usuário avaliou < 6 filmes do país principal → −15%
  {
    const mainCountry = (movie.countries || [])[0];
    if (mainCountry) {
      let n = 0;
      for (let i = 0; i < state.movies.length; i++) {
        const m2 = state.movies[i];
        if (m2.id === movie.id) continue;
        const v2 = m2.votes && m2.votes[person];
        if (v2 && v2.score != null && (m2.countries || []).includes(mainCountry)) n++;
      }
      if (n < 6) pctFinal = pctFinal * 0.85;
    }
  }
  // Temática de minorias após 1999: −20% se o ano > 1999 e houver palavras-chave típicas
  // (usa keywords da TMDB quando disponíveis; senão cai na sinopse/gênero)
  const yearNum = parseInt(movie.year);
  if (!isNaN(yearNum) && yearNum > 1999) {
    let hasMinorityTheme = false;
    if (movie.keywords && movie.keywords.length) {
      const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
      hasMinorityTheme = MINORITY_KW_LIST.some(k => kwSet.has(k));
    }
    if (!hasMinorityTheme) {
      // fallback: sinopse + gêneros (para títulos ainda sem keywords carregadas)
      const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + (movie.genres || []).join(' ')).toLowerCase();
      const fallbackRe = /\b(lgbt|lgbtq|queer|transgender|homosexual|bisexual|gay protagonist|gender identity|homophobia|transphobia|diversidade|inclusão|identidade de gênero)\b/i;
      hasMinorityTheme = fallbackRe.test(textToCheck);
    }
    if (hasMinorityTheme) {
      pctFinal = pctFinal * 0.8; // diminui 20%
    }
  }

  // Sexismo / feminismo / misoginia: −20% em QUALQUER época
  {
    let hasSexismTheme = false;
    if (movie.keywords && movie.keywords.length) {
      const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
      hasSexismTheme = SEXISM_KW_LIST.some(k => kwSet.has(k));
    }
    if (!hasSexismTheme) {
      const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + (movie.genres || []).join(' ')).toLowerCase();
      const sexismRe = /\b(sexism|sexist|misogyny|misogynist|feminism|feminist|patriarchy|patriarchal|chauvinism|toxic masculinity|male gaze|sexismo|misoginia|feminismo|feminista)\b/i;
      hasSexismTheme = sexismRe.test(textToCheck);
    }
    if (hasSexismTheme) {
      pctFinal = pctFinal * 0.8; // diminui 20%
    }
  }

  // Temas raciais: −20% se ano > 2012
  if (!isNaN(yearNum) && yearNum > 2012) {
    let hasRacialTheme = false;
    if (movie.keywords && movie.keywords.length) {
      const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
      hasRacialTheme = RACIAL_KW_LIST.some(k => kwSet.has(k));
    }
    if (!hasRacialTheme) {
      const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + (movie.genres || []).join(' ')).toLowerCase();
      const racialRe = /\b(racism|racist|racial (tension|conflict|injustice|discrimination|prejudice|identity)|systemic racism|police brutality|black lives matter|white privilege|race relations|racismo|racial)\b/i;
      hasRacialTheme = racialRe.test(textToCheck);
    }
    if (hasRacialTheme) {
      pctFinal = pctFinal * 0.8; // diminui 20%
    }
  }

  // Xenofobia a estrangeiros: −20% se ano > 2006
  if (!isNaN(yearNum) && yearNum > 2006) {
    let hasXenoTheme = false;
    if (movie.keywords && movie.keywords.length) {
      const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
      hasXenoTheme = XENOPHOBIA_KW_LIST.some(k => kwSet.has(k));
    }
    if (!hasXenoTheme) {
      const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + (movie.genres || []).join(' ')).toLowerCase();
      const xenoRe = /\b(xenophobia|xenophobic|anti-?immigrant|anti-?immigration|refugee crisis|nativism|xenofobia|xenófob)\b/i;
      hasXenoTheme = xenoRe.test(textToCheck);
    }
    if (hasXenoTheme) {
      pctFinal = pctFinal * 0.8; // diminui 20%
    }
  }

  // Filosofia / existencialismo: −10% em QUALQUER época
  {
    let hasPhilosophyTheme = false;
    if (movie.keywords && movie.keywords.length) {
      const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
      hasPhilosophyTheme = PHILOSOPHY_KW_LIST.some(k => kwSet.has(k));
    }
    if (!hasPhilosophyTheme) {
      const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '') + ' ' + (movie.genres || []).join(' ')).toLowerCase();
      const philRe = /\b(philosophy|philosophical|philosopher|existentialism|existential|metaphysics|metaphysical|nihilism|absurdism|meaning of life|human condition|filosofia|filosófico|existencialismo|existencial)\b/i;
      hasPhilosophyTheme = philRe.test(textToCheck);
    }
    if (hasPhilosophyTheme) {
      pctFinal = pctFinal * 0.9; // diminui 10%
    }
  }

  // Propaganda pró-comunismo/socialismo: −20%
  // + lista explícita de títulos (Democracia em Vertigem, Ainda Estou Aqui, O Agente Secreto…)
  {
    let hasCommiePropaganda = isForcedCommiePenalty(movie);
    let isCritiqueOrContext = false;
    if (!hasCommiePropaganda) {
      if (movie.keywords && movie.keywords.length) {
        const kwSet = new Set(movie.keywords.map(k => String(k).toLowerCase()));
        isCritiqueOrContext = COMMIE_CRITIQUE_KW_LIST.some(k => kwSet.has(k));
        if (!isCritiqueOrContext) {
          hasCommiePropaganda = COMMIE_PROPAGANDA_KW_LIST.some(k => kwSet.has(k));
        }
      }
      if (!hasCommiePropaganda && !isCritiqueOrContext) {
        const textToCheck = ((movie.synopsisPt || '') + ' ' + (movie.plot || '')).toLowerCase();
        if (/\b(anti-?communis|anti-?socialis|crítica ao comunismo|crítica ao socialismo|gulag|dissiden|defector)\b/i.test(textToCheck)) {
          isCritiqueOrContext = true;
        } else {
          const propRe = /\b(propaganda comunista|propaganda socialista|apologia ao comunismo|apologia ao socialismo|pro-?communist|pro-?socialist|communist propaganda|socialist propaganda|agitprop|filme militante|cinema militante)\b/i;
          hasCommiePropaganda = propRe.test(textToCheck);
        }
      }
    }
    if (hasCommiePropaganda && !isCritiqueOrContext) {
      pctFinal = pctFinal * 0.8; // diminui 20%
    }
  }

  const pct = Math.round(pctFinal);
  return {
    ready: true,
    pct,
    _debug: {
      raw: raw.toFixed(2),
      maxPossible: maxPossible.toFixed(2),
      ratio: sinalCru.toFixed(3),
      corr: corr.toFixed(2),
      count,
      tasteEvidence: tasteEvidence.toFixed(2),
      tastePct: Math.round(tastePct),
      qualityPct: Math.round(qualityPct),
      extScore: extScore != null ? extScore.toFixed(1) : null,
      tasteW: tasteWeight.toFixed(2),
      pctFinal
    }
  };
  } catch(e) {
    console.error('estimateAffinity failed for', movie && movie.id, e);
    return { ready:false, pct:50 };
  }
}

function computeRecommendations(){
  const myRatedCount = state.movies.filter(m=>m.votes[state.me] && m.votes[state.me].score!=null).length;
  if(myRatedCount < 6) return { ready:false, items:[] };
  const candidates = state.movies.filter(m =>
    !(m.votes[state.me] && m.votes[state.me].score!=null) &&
    !(m.hiddenBy && m.hiddenBy.includes(state.me)) &&
    !(m.dismissedBy && m.dismissedBy.includes(state.me))
  );
  const scored = candidates.map(m=>({ m, pct: estimateAffinity(m, state.me).pct }));
  scored.sort((a,b)=>b.pct - a.pct);
  return { ready:true, items: scored.slice(0,15) };
}

function explanationHtml(up, down){
  if(up.length===0 && down.length===0) return '';
  let html = '<div style="margin-top:8px;font-size:12px">';
  if(up.length){
    html += `<div style="color:var(--like);font-weight:600;margin-bottom:2px">O que puxa pra cima:</div>
      <ul style="margin:0 0 6px;padding-left:16px;color:var(--muted)">${up.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ul>`;
  }
  if(down.length){
    html += `<div style="color:var(--dislike);font-weight:600;margin-bottom:2px">O que está segurando a %:</div>
      <ul style="margin:0;padding-left:16px;color:var(--muted)">${down.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ul>`;
  }
  html += '</div>';
  return html;
}

function explainRecommendation(movie, person){
  const { maps, count } = buildTasteProfile(person, movie.id);
  const up = [], down = [];

  function topReason(map, keys, prefixUp, prefixDown){
    let best=null, worst=null;
    keys.forEach(k=>{
      const entry = map[k];
      if(!entry || entry.n<2) return;
      const w = shrunkWeight(entry);
      if(w>1.4 && (!best || w>best.w)) best = {k, w};
      if(w<-1.2 && (!worst || w<worst.w)) worst = {k, w};
    });
    if(best) up.push(`${prefixUp} ${best.k}`);
    if(worst) down.push(`${prefixDown} ${worst.k}`);
  }
  // Gênero não entra na explicação: peso zero no algoritmo (a pessoa já filtra o gênero na interface)
  if(movie.director) topReason(maps.director, movie.director.split(',').map(s=>s.trim()), 'Você gosta dos trabalhos de', 'Filmes do diretor');
  if(movie.actors) topReason(maps.actor, movie.actors.split(',').map(s=>s.trim()), 'Você gosta de filmes com', 'Filmes com');

  let anyStrongCrossUser = false;
  state.family.members.forEach(other=>{
    if(other===person) return;
    const v = movie.votes[other];
    if(v && v.score!=null){
      const aff = crossUserAffinityFor(person, other, movie);
      if(v.score>=8 && aff>0.35 && up.length<4){ up.push(`${other} deu nota ${v.score} e o gosto de vocês combina bastante nesse tipo de filme`); anyStrongCrossUser=true; }
      if(v.score<=4 && aff>0.35 && down.length<4){ down.push(`${other} deu nota baixa (${v.score}) e o gosto de vocês costuma combinar`); anyStrongCrossUser=true; }
    }
  });

  const r = movie.ratings || {};
  const criticVals = [r.imdb, r.rtCritics, r.metacritic].filter(v=>v!=null);
  if(criticVals.length){
    const avg = criticVals.reduce((a,b)=>a+b,0)/criticVals.length;
    if(avg>=7.5 && up.length<4) up.push(`Bem avaliado pela crítica/público em geral (${avg.toFixed(1)}/10)`);
    if(avg<6.5 && down.length<4) down.push(`Nota da crítica/público é só mediana (${avg.toFixed(1)}/10)`);
  } else if(down.length<4){
    down.push('Não há nota de crítica disponível pra usar como referência extra');
  }
  const votes = r.imdbVotes;
  if(votes!=null){
    if(votes>=50000 && r.imdb!=null && r.imdb>=7 && up.length<4){
      up.push(`Nota alta com muita gente avaliando no IMDb (${votes.toLocaleString('pt-BR')} votos) — mais confiável`);
    }
    if(votes<1000 && down.length<4){
      down.push(`Poucas avaliações no IMDb ainda (${votes.toLocaleString('pt-BR')}) — a nota é menos confiável, então pesa menos`);
    }
  }

  const { corr } = backtestAccuracy(person);
  if(count < 15){
    down.push(`Você avaliou ${count} filme(s) até agora — a % fica mais assertiva conforme você avalia mais (o ideal é passar de 15)`);
  }
  if(corr < 0.4){
    down.push('O algoritmo ainda está calibrando os padrões do seu gosto — quanto mais você avalia, mais as % se diferenciam');
  }
  if(up.length===0 && down.length===0){
    down.push('Não encontrei padrões fortes o suficiente pra puxar a % pra cima ou pra baixo com confiança');
  }
  const { raw, maxPossible } = rawTasteSignal(movie, maps);
  const ratio = maxPossible > 0 ? (raw/maxPossible) : 0;
  const evid = Math.max(0, Math.min(1, maxPossible / 12));
  down.push(`🔧 Diagnóstico v11: raw=${raw.toFixed(2)} max=${maxPossible.toFixed(2)} razão=${ratio.toFixed(3)} evidência=${evid.toFixed(2)} corr=${corr.toFixed(2)} avaliados=${count}`);

  return { up: up.slice(0,4), down: down.slice(0,8) };
}

async function dismissMovieFor(person, movieId){
  const movie = state.movies.find(x=>x.id===movieId);
  if(movie){
    if(!movie.dismissedBy) movie.dismissedBy = [];
    if(!movie.dismissedBy.includes(person)) movie.dismissedBy.push(person);
    await fbSaveMovie(movie);
  }
  if(state.lists.watching[person]){
    state.lists.watching[person].items = state.lists.watching[person].items.filter(it=>it.movieId!==movieId);
    await saveListData('watching');
  }
}

/* ---------- IMPORTAÇÃO EM MASSA DO IMDB ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field+='"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* ignore */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(rows.length===0) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r=>r.length>1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{ obj[h.trim()] = (r[i]||'').trim(); });
    return obj;
  });
}

        let already = 0, withRating = 0, withoutRating = 0;
        rows.forEach(r=>{
          const imdbId = (r[idField]||'').trim();
          if(!imdbId) return;
          const rawRating = ratingField ? r[ratingField] : '';
          const parsedRating = parseInt(rawRating);
          const hasRating = rawRating!=null && rawRating!=='' && !isNaN(parsedRating);
          if(existingIds.has(imdbId)){ already++; }
          if(hasRating) withRating++; else withoutRating++;
          queue.push({ imdbId, rating: hasRating ? parsedRating : null, dateRated: dateField ? (r[dateField]||null) : null, existing: existingIds.has(imdbId) });
        });
        state.importState = {
          step:'preview', total: queue.length, alreadyInCatalog: already, toFetch: queue.length-already,
          withRating, withoutRating,
          rawQueue: queue, destinations: { priorities:false, watching:false, noted:false }
        };
        render();
      });
    }
  }
}

window.__openImport = ()=>{
  let saved = null;
  try{
    const raw = localStorage.getItem('cineclube-import-progress');
    if(raw) saved = JSON.parse(raw);
  }catch(e){}
  if(saved && saved.queue && saved.processed < saved.queue.length){
    state.importState = saved;
    state.importState.paused = true;
    state.importState.step = 'paused';
  } else {
    state.importState = { step:'upload' };
  }
  state.importOpen = true;
  render();
};
window.__toggleImportDest = (key)=>{
  state.importState.destinations[key] = !state.importState.destinations[key];
  render();
};

async function __applyExistingRating(entry){
  const movie = state.movies.find(m=>m.imdbId===entry.imdbId);
  if(!movie) return false;
  if(entry.rating!=null){
    if(!movie.votes) movie.votes = {};
    movie.votes[state.me] = { liked: null, score: entry.rating };
    if(!movie.checkins) movie.checkins = {};
    if(!movie.checkins[state.me]) movie.checkins[state.me] = entry.dateRated ? new Date(entry.dateRated).toISOString() : new Date().toISOString();
  }
  return true;
}

async function applyImportDestinations(destinations, movieIds){
  if(!destinations || !movieIds || !movieIds.length) return;
  const keys = Object.keys(destinations).filter(k=>destinations[k]);
  for(const key of keys){
    if(!state.lists[key][state.me]) state.lists[key][state.me] = { public: LIST_TYPES[key].hasPublic, items: [] };
    const existingIds = new Set(state.lists[key][state.me].items.map(it=>it.movieId));
    movieIds.forEach(movieId=>{
      if(!existingIds.has(movieId)){
        state.lists[key][state.me].items.push({ id: uid(), movieId, addedAt: new Date().toISOString() });
        existingIds.add(movieId);
      }
    });
    await saveListData(key);
  }
}

function persistImportProgress(){
  try{
    localStorage.setItem('cineclube-import-progress', JSON.stringify(state.importState));
  }catch(e){ /* se não der, só não retoma automaticamente depois */ }
}
function clearImportProgress(){
  try{ localStorage.removeItem('cineclube-import-progress'); }catch(e){}
}

async function saveImportErrorLog(entries){
  if(!entries || !entries.length) return;
  if(!state.importErrorLog) state.importErrorLog = [];
  state.importErrorLog.unshift({ at: new Date().toISOString(), titles: entries.map(e=>({ title: null, year: null, imdbId: e.imdbId })) });
  state.importErrorLog = state.importErrorLog.slice(0,10);
  await sSet('import-error-log', JSON.stringify(state.importErrorLog), true);
}

async function __runImportQueue(){
  const st = state.importState;
  st.step = 'running';
  if(!st.destMovieIds) st.destMovieIds = [];
  if(!st.failedEntries) st.failedEntries = [];
  render();
  while(st.processed < st.queue.length){
    if(st.paused) return;
    const entry = st.queue[st.processed];
    try{
      if(entry.existing){
        await __applyExistingRating(entry);
        const existingMovie = state.movies.find(m=>m.imdbId===entry.imdbId);
        if(existingMovie){
          st.destMovieIds.push(existingMovie.id);
          await fbSaveMovie(existingMovie);
        }
      } else {
        if(!state.apiKey){ st.errors++; }
        else {
          const data = await fetchAllSources(entry.imdbId);
          const movie = {
            id: uid(), imdbId: entry.imdbId,
            titleOriginal: data.titleOriginal, titleEn: data.titleEn, titlePt: data.titlePt,
            type: data.type || 'movie', year: data.year, poster: data.poster,
            synopsisPt: data.synopsisPt, synopsisAuto: data.synopsisAuto,
            director: data.director, writer: data.writer, actors: data.actors, genres: data.genres,
            countries: data.countries||[], languages: data.languages||[], primaryLanguage: data.primaryLanguage||'', production: data.production||'',
            runtimeMin: data.runtimeMin, releaseDate: data.releaseDate, ratings: data.ratings,
            addedAt: new Date().toISOString(), addedBy: state.me, votes: {}, hiddenBy: [], dismissedBy: []
          };
          state.family.members.forEach(m => movie.votes[m] = {liked:null, score:null});
          movie.checkins = {};
          state.family.members.forEach(m => movie.checkins[m] = null);
          if(entry.rating!=null){
            movie.votes[state.me] = { liked: null, score: entry.rating };
            movie.checkins[state.me] = entry.dateRated ? new Date(entry.dateRated).toISOString() : new Date().toISOString();
          }
          state.movies.push(movie);
          st.destMovieIds.push(movie.id);
          await fbSaveMovie(movie);
          st.added++;
          st.omdbCallsToday = (st.omdbCallsToday||0) + 1;
        }
      }
    }catch(e){
      st.errors++;
      st.failedEntries.push({ imdbId: entry.imdbId });
      if(/limit|429|quota/i.test(e.message||'')){
        st.dailyLimitHit = true;
        st.paused = true;
        st.step = 'paused';
        await applyImportDestinations(st.destinations, st.destMovieIds);
        st.destMovieIds = [];
        await saveImportErrorLog(st.failedEntries);
        st.failedEntries = [];
        persistImportProgress();
        render();
        return;
      }
    }
    st.processed++;
    if(st.processed % 8 === 0){
      persistImportProgress();
      render();
    }
    if(!entry.existing && (st.omdbCallsToday||0) >= 950){
      st.dailyLimitHit = true;
      st.paused = true;
      st.step = 'paused';
      await applyImportDestinations(st.destinations, st.destMovieIds);
      st.destMovieIds = [];
      await saveImportErrorLog(st.failedEntries);
      st.failedEntries = [];
      persistImportProgress();
      render();
      return;
    }
    if(!entry.existing){
      await new Promise(res=>setTimeout(res, 350));
    }
  }
  await applyImportDestinations(st.destinations, st.destMovieIds);
  await saveImportErrorLog(st.failedEntries);
  st.failedEntries = [];
  st.step = 'done';
  clearImportProgress();
  render();
}

window.__startImport = ()=>{
  const raw = state.importState.rawQueue;
  state.importState.queue = raw;
  state.importState.processed = 0;
  state.importState.added = 0;
  state.importState.errors = 0;
  state.importState.paused = false;
  state.importState.omdbCallsToday = 0;
  persistImportProgress();
  __runImportQueue();
};
window.__pauseImport = ()=>{
  state.importState.paused = true;
  state.importState.step='paused';
  persistImportProgress();
  render();
};
window.__resumeImport = ()=>{ state.importState.paused = false; state.importState.omdbCallsToday = 0; __runImportQueue(); };

/* ---------- RASTREADOR DE EPISÓDIOS ---------- */
window.__openEpisodeTracker = (movieId)=>{
  state.episodeTrackerId = movieId;
  state.episodeTrackerSeason = null;
  render();
};

function episodeKey(season, ep){ return 'S'+season+'E'+ep; }

function renderEpisodeTrackerModal(movieId){
  const m = state.movies.find(x=>x.id===movieId);
  if(!m){ state.episodeTrackerId=null; return; }
  const seasons = m.seasons || [];
  const openSeason = state.episodeTrackerSeason;
  const episodes = (openSeason!=null && m.episodeData && m.episodeData[openSeason]) ? m.episodeData[openSeason] : null;

  document.body.insertAdjacentHTML('beforeend', `
  <div class="overlay" id="episodes-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>📺 ${escapeHtml(displayTitle(m))}</h2><button class="close-x" onclick="__closeEpisodeTracker()">×</button></div>
      <p class="hint">Marque episódios assistidos e avalie cada um individualmente. Dados de temporadas vêm da última vez que você tocou em "Verificar novidades".</p>
      ${seasons.length===0 ? `<p class="hint">Nenhuma temporada carregada ainda — feche essa tela e toque em "🔄 Verificar novidades" no filme primeiro.</p>` : ''}
      <div class="panel">
        ${seasons.map(s=>`
          <div class="chip ${openSeason===s.number?'active':''}" style="display:block;text-align:left;margin-bottom:6px" onclick="__toggleSeason(${s.number})">
            Temporada ${s.number}${s.name && !/^Season|Temporada/i.test(s.name)?' — '+escapeHtml(s.name):''} · ${s.episodeCount} episódios ${s.airDate?'· '+new Date(s.airDate+'T00:00').toLocaleDateString('pt-BR'):''}
          </div>
        `).join('')}
      </div>
      ${openSeason!=null ? `
        <div class="panel">
          <h3 style="font-size:16px">Temporada ${openSeason}</h3>
          ${!episodes ? `<div class="loading-spin"></div>` : episodes.map(ep=>{
            const key = episodeKey(openSeason, ep.number);
            const myEp = (m.episodeVotes && m.episodeVotes[state.me] && m.episodeVotes[state.me][key]) || { watched:false, liked:null };
            return `
            <div class="vote-line" style="flex-direction:column;align-items:stretch;gap:6px;padding:10px 0">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span><b>E${ep.number}</b> ${escapeHtml(ep.name||'')}</span>
                <span class="hint" style="margin:0">${ep.airDate?new Date(ep.airDate+'T00:00').toLocaleDateString('pt-BR'):''}</span>
              </div>
              <div style="display:flex;gap:8px;align-items:center">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0">
                  <input type="checkbox" style="width:auto" ${myEp.watched?'checked':''} onchange="__toggleEpisodeWatched('${key}')"> assistido
                </label>
                <button class="icon-btn" style="font-size:16px;${myEp.liked==='like'?'color:var(--like)':''}" onclick="__setEpisodeLike('${key}','like')">👍</button>
                <button class="icon-btn" style="font-size:16px;${myEp.liked==='dislike'?'color:var(--dislike)':''}" onclick="__setEpisodeLike('${key}','dislike')">👎</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  </div>`);
  document.getElementById('episodes-overlay').addEventListener('click',(e)=>{ if(e.target.id==='episodes-overlay') __closeEpisodeTracker(); });

  window.__closeEpisodeTracker = ()=>{ state.episodeTrackerId=null; render(); };
  window.__toggleSeason = async (num)=>{
    state.episodeTrackerSeason = (state.episodeTrackerSeason===num) ? null : num;
    if(state.episodeTrackerSeason!=null){
      if(!m.episodeData) m.episodeData = {};
      if(!m.episodeData[num]){
        render();
        try{
          const eps = await fetchTmdbSeasonEpisodes(m.tmdbId, num);
          m.episodeData[num] = eps;
          await fbSaveMovie(m);
        }catch(e){ alert('Erro ao buscar episódios: '+e.message); }
      }
    }
    render();
  };
  window.__toggleEpisodeWatched = async (key)=>{
    if(!m.episodeVotes) m.episodeVotes = {};
    if(!m.episodeVotes[state.me]) m.episodeVotes[state.me] = {};
    const cur = m.episodeVotes[state.me][key] || { watched:false, liked:null };
    cur.watched = !cur.watched;
    m.episodeVotes[state.me][key] = cur;
    await fbSaveMovie(m);
    render();
  };
  window.__setEpisodeLike = async (key, val)=>{
    if(!m.episodeVotes) m.episodeVotes = {};
    if(!m.episodeVotes[state.me]) m.episodeVotes[state.me] = {};
    const cur = m.episodeVotes[state.me][key] || { watched:false, liked:null };
    cur.liked = (cur.liked===val) ? null : val;
    m.episodeVotes[state.me][key] = cur;
    await fbSaveMovie(m);
    render();
  };
}

/* ---------- HISTÓRICO DE ERROS DE ATUALIZAÇÃO ---------- */
window.__openErrorLog = ()=>{ state.errorLogOpen = true; render(); };

function renderErrorRun(run, idx, logKey){
  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="font-size:15px;margin:0">${new Date(run.at).toLocaleString('pt-BR')} · ${run.titles.length} erro(s)</h3>
        <button class="icon-btn" onclick="__deleteErrorRun('${logKey}',${idx})">🗑️</button>
      </div>
      ${run.titles.map((t,ti)=>`
        <div class="vote-line">
          <span>${t.title ? escapeHtml(t.title)+(t.year?` (${t.year})`:'') : escapeHtml(t.imdbId||'?')}</span>
          <span style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="__retryFailedTitle('${t.imdbId}')">🔎 Tentar de novo</button>
            <button class="icon-btn" onclick="__deleteErrorItem('${logKey}',${idx},${ti})">🗑️</button>
          </span>
        </div>
      `).join('')}
    </div>`;
}

function renderErrorLogModal(){
  const updateLog = state.updateErrorLog || [];
  const importLog = state.importErrorLog || [];
  document.body.insertAdjacentHTML('beforeend', `
  <div class="overlay" id="errorlog-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>🕘 Histórico de erros</h2><button class="close-x" onclick="__closeErrorLog()">×</button></div>

      <h3 style="font-size:17px;color:var(--gold);margin-top:10px">Atualizações em lote</h3>
      <p class="hint">Últimas ${Math.min(updateLog.length,10)} rodadas de "Atualizar catálogo completo" com erro.</p>
      ${updateLog.length===0 ? `<p class="hint">Nenhum erro registrado.</p>` : updateLog.map((run,idx)=>renderErrorRun(run, idx, 'update')).join('')}
      ${updateLog.length ? `<button class="btn btn-danger btn-block" style="margin-top:6px" onclick="__clearErrorLog('update')">🗑️ Limpar histórico de atualizações</button>` : ''}

      <div class="divider"></div>

      <h3 style="font-size:17px;color:var(--gold)">Importações do IMDb</h3>
      <p class="hint">Últimas ${Math.min(importLog.length,10)} rodadas de importação com erro.</p>
      ${importLog.length===0 ? `<p class="hint">Nenhum erro registrado.</p>` : importLog.map((run,idx)=>renderErrorRun(run, idx, 'import')).join('')}
      ${importLog.length ? `<button class="btn btn-danger btn-block" style="margin-top:6px" onclick="__clearErrorLog('import')">🗑️ Limpar histórico de importações</button>` : ''}
    </div>
  </div>`);
  document.getElementById('errorlog-overlay').addEventListener('click',(e)=>{ if(e.target.id==='errorlog-overlay') __closeErrorLog(); });

  window.__closeErrorLog = ()=>{ state.errorLogOpen=false; render(); };
  window.__clearErrorLog = async (logType)=>{
    if(!confirm('Limpar todo esse histórico de erros?')) return;
    const key = logType==='update' ? 'update-error-log' : 'import-error-log';
    if(logType==='update') state.updateErrorLog = []; else state.importErrorLog = [];
    await sSet(key, JSON.stringify([]), true);
    render(); state.errorLogOpen = true; render();
  };
  window.__deleteErrorRun = async (logType, idx)=>{
    const key = logType==='update' ? 'update-error-log' : 'import-error-log';
    const arr = logType==='update' ? state.updateErrorLog : state.importErrorLog;
    arr.splice(idx,1);
    await sSet(key, JSON.stringify(arr), true);
    render(); state.errorLogOpen = true; render();
  };
  window.__deleteErrorItem = async (logType, runIdx, itemIdx)=>{
    const key = logType==='update' ? 'update-error-log' : 'import-error-log';
    const arr = logType==='update' ? state.updateErrorLog : state.importErrorLog;
    arr[runIdx].titles.splice(itemIdx,1);
    if(arr[runIdx].titles.length===0) arr.splice(runIdx,1);
    await sSet(key, JSON.stringify(arr), true);
    render(); state.errorLogOpen = true; render();
  };
  window.__retryFailedTitle = (imdbId)=>{
    state.errorLogOpen = false;
    state.addFlow = { step:'input', url:`https://www.imdb.com/title/${imdbId}/`, error:null, loading:false, data:null };
    render();
  };
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW não registrado', e));
  });
}

init();
})();
</script>
